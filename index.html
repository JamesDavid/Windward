// ================================================================
// RENDERER, PART 2 — structures, ships, craft, the priest, effects,
// and fog-of-war presentation. One chassis per side (§14A.2):
// every Aeolus structure is a tethered balloon, every Poseidon
// structure a moored barge; four payloads each.
// ================================================================

R.fx = [];
R.islandBars = new Map();

function makeChassis(side, onLand) {
  const grp = new THREE.Group();
  if (side === 'A') {
    // tethered balloon: envelope + slung gondola + tether
    const env = new THREE.Mesh(
      new THREE.SphereGeometry(0.26, 10, 8),
      new THREE.MeshLambertMaterial({ color: Palette.ivory }));
    env.scale.set(1.25, 1, 1);
    env.position.y = 0.95;
    const gond = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.09, 0.12),
      new THREE.MeshLambertMaterial({ color: Palette.bronze }));
    gond.position.y = 0.62;
    const tether = new THREE.Mesh(
      new THREE.BoxGeometry(0.015, onLand ? 0.5 : 0.6, 0.015),
      new THREE.MeshBasicMaterial({ color: 0x9c8b6a }));
    tether.position.y = 0.3;
    grp.add(env, gond, tether);
    grp.userData.envelope = env;
  } else {
    const hull = new THREE.Mesh(
      new THREE.BoxGeometry(0.55, 0.1, 0.34),
      new THREE.MeshLambertMaterial({ color: 0x274046 }));
    hull.position.y = 0.07;
    const deck = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.05, 0.26),
      new THREE.MeshLambertMaterial({ color: 0x37585e }));
    deck.position.y = 0.14;
    grp.add(hull, deck);
  }
  return grp;
}

function makePayload(side, type, stats) {
  const grp = new THREE.Group();
  const trim = new THREE.MeshLambertMaterial({ color: side === 'A' ? Palette.gold : Palette.poseidonGlow });
  const dark = new THREE.MeshLambertMaterial({ color: Palette.bronze });
  const y = side === 'A' ? 0.62 : 0.2;
  switch (type) {
    case 'vane': {
      for (let i = 0; i < 4; i++) {
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.03, 0.05), i % 2 ? trim : dark);
        arm.position.y = y + 0.1;
        arm.rotation.y = (i / 4) * Math.PI;
        grp.add(arm);
      }
      break;
    }
    case 'bolt': case 'mast': {
      const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.06, 0.08), dark);
      barrel.position.set(0.14, y + 0.06, 0);
      grp.add(barrel);
      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.1), trim);
      tip.position.set(0.3, y + 0.06, 0);
      grp.add(tip);
      grp.userData.rotates = true;
      break;
    }
    case 'shield': {
      const arc = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.42, 0.32, 12, 1, true, -Math.PI / 3, (2 * Math.PI) / 3),
        new THREE.MeshLambertMaterial({
          color: side === 'A' ? Palette.aeolusGlow : Palette.poseidonGlow,
          transparent: true, opacity: 0.4, side: THREE.DoubleSide
        }));
      arc.position.y = y + 0.1;
      arc.rotation.y = Math.PI / 2;
      grp.add(arc);
      grp.userData.rotates = true;
      break;
    }
    case 'temple': {
      const stone = new THREE.MeshLambertMaterial({ color: side === 'A' ? Palette.ivory : Palette.poseidonStone });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.36, 0.1, 8), stone);
      base.position.y = 0.1;
      for (let i = 0; i < 5; i++) {
        const col = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.3, 5), stone);
        const a = (i / 5) * Math.PI * 2;
        col.position.set(Math.cos(a) * 0.22, 0.3, Math.sin(a) * 0.22);
        grp.add(col);
      }
      const roof = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.2, 8), trim);
      roof.position.y = 0.52;
      grp.add(base, roof);
      break;
    }
    case 'yard': {
      for (const dx of [-0.2, 0.2]) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4, 0.06), dark);
        post.position.set(dx, 0.24, 0);
        grp.add(post);
      }
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.08), trim);
      beam.position.y = 0.44;
      grp.add(beam);
      break;
    }
  }
  return grp;
}

function structVisibleToPlayer(state, st) {
  if (st.owner === 'A') return 'full';
  const k = cellKey(st.cell[0], st.cell[1]);
  if (state.vision.A.has(k)) return 'full';
  if (state.memory.A.has('st:' + st.id)) return 'dim';
  return 'hidden';
}

function syncStructures(state) {
  const seen = new Set();
  for (const st of state.structures) {
    if (st.hp <= 0) continue;
    seen.add(st.id);
    let rec = R.structMeshes.get(st.id);
    if (!rec) {
      const onLand = st.site === 'plot' || state.map.land.has(cellKey(st.cell[0], st.cell[1]));
      const grp = new THREE.Group();
      const chassis = st.type === 'temple' || st.type === 'yard' ? new THREE.Group() : makeChassis(st.owner, onLand);
      const payload = makePayload(st.owner, st.type, st);
      grp.add(chassis, payload);
      const baseY = onLand ? CONFIG.Render.ISLAND_HEIGHT : (st.owner === 'A' ? CONFIG.Render.AIR_ALTITUDE - 0.6 : 0);
      grp.position.set(worldX(st.cell[0]), baseY, worldZ(st.cell[1]));
      // scaffold ring at ground level while raising
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.42, 0.52, 20),
        new THREE.MeshBasicMaterial({ color: Palette.socket, transparent: true, opacity: 0.95, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.12;
      grp.add(ring);
      R.scene.add(grp);
      rec = { grp, payload, ring, chassis };
      R.structMeshes.set(st.id, rec);
    }
    const vis = structVisibleToPlayer(state, st);
    rec.grp.visible = vis !== 'hidden';
    const dim = vis === 'dim';
    rec.grp.traverse(o => {
      if (o.material) {
        o.material.transparent = true;
        o.material.opacity = dim ? 0.3 : (o.userData && o.userData.baseOpacity) || (st.buildProgress < 1 ? 0.6 : 1);
      }
    });
    if (rec.payload.userData.rotates) rec.payload.rotation.y = -st.facing;
    // building: ring shows progress; bob balloons in the wind
    rec.ring.visible = st.buildProgress < 1;
    if (st.buildProgress < 1) rec.ring.scale.setScalar(0.4 + st.buildProgress * 0.8);
    if (rec.chassis.userData && rec.chassis.userData.envelope) {
      const w = state.wind.at(st.cell[0], st.cell[1]);
      rec.chassis.rotation.z = -w.x * 0.12;
      rec.chassis.rotation.x = w.z * 0.12;
      rec.chassis.position.y = 0.03 * Math.sin(state.time * 1.7 + st.id);
    }
    // hit flash
    if (state.time - st.lastHitAt < 0.15) rec.grp.position.y += 0.02;
  }
  for (const [id, rec] of R.structMeshes) {
    if (!seen.has(id)) {
      R.scene.remove(rec.grp);
      R.structMeshes.delete(id);
    }
  }
}

// ---- movers: haulers, priests, wave craft ----
function makeMoverMesh(m) {
  const grp = new THREE.Group();
  if (m.owner === 'A') {
    const isPriest = m.kind === 'priest';
    const env = new THREE.Mesh(
      new THREE.SphereGeometry(isPriest ? 0.24 : 0.18, 10, 8),
      new THREE.MeshLambertMaterial({ color: isPriest ? Palette.gold : Palette.ivory }));
    env.scale.set(1.5, 0.9, 0.9);
    env.position.y = 0.22;
    const gond = new THREE.Mesh(
      new THREE.BoxGeometry(isPriest ? 0.3 : 0.24, 0.07, 0.1),
      new THREE.MeshLambertMaterial({ color: Palette.bronze }));
    gond.position.y = 0.02;
    grp.add(env, gond);
    if (isPriest) {
      const banner = new THREE.Mesh(
        new THREE.PlaneGeometry(0.3, 0.1),
        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
      banner.position.set(-0.3, 0.28, 0);
      grp.add(banner);
    }
    grp.userData.env = env;
  } else {
    // sea craft: trireme silhouettes
    const big = m.kind === 'heavy';
    const hull = new THREE.Mesh(
      new THREE.BoxGeometry(big ? 0.6 : 0.42, 0.09, big ? 0.26 : 0.18),
      new THREE.MeshLambertMaterial({ color: m.kind === 'transport' ? 0x3a5b52 : 0x22454e }));
    hull.position.y = 0.06;
    const prow = new THREE.Mesh(
      new THREE.ConeGeometry(0.07, 0.2, 5),
      new THREE.MeshLambertMaterial({ color: Palette.bronze }));
    prow.rotation.z = -Math.PI / 2;
    prow.position.set(big ? 0.36 : 0.27, 0.08, 0);
    grp.add(hull, prow);
    if (m.kind === 'siphon' || m.kind === 'priest') {
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.05, 0.34, 6),
        new THREE.MeshLambertMaterial({ color: Palette.poseidonGlow }));
      pipe.position.y = 0.26;
      grp.add(pipe);
    }
  }
  return grp;
}

function moverY(m) {
  return m.owner === 'A' ? CONFIG.Render.AIR_ALTITUDE + 0.05 : 0.03;
}

function syncMovers(state) {
  const seen = new Set();
  const movers = [];
  for (const h of state.haulers) if (h.state !== 'dead') movers.push(h);
  for (const s of ['A', 'P']) {
    const p = state.priests[s];
    if (p && p.state !== 'dead') movers.push(p);
  }
  for (const c of state.craft) if (!c.dead) movers.push(c);

  for (const m of movers) {
    seen.add(m.id);
    let rec = R.craftMeshes.get(m.id);
    if (!rec) {
      const grp = makeMoverMesh(m);
      R.scene.add(grp);
      rec = { grp, lastPos: m.pos.slice() };
      R.craftMeshes.set(m.id, rec);
    }
    // fog: enemy movers need live vision (§14B.2)
    const visible = m.owner === 'A' ||
      state.vision.A.has(cellKey(Math.round(m.pos[0]), Math.round(m.pos[1])));
    rec.grp.visible = visible;
    const dx = m.pos[0] - rec.lastPos[0], dz = m.pos[1] - rec.lastPos[1];
    if (Math.abs(dx) + Math.abs(dz) > 0.001) {
      rec.grp.rotation.y = -Math.atan2(dz, dx);
      rec.lastPos = m.pos.slice();
    }
    rec.grp.position.set(worldX(m.pos[0]), moverY(m), worldZ(m.pos[1]));
    if (m.state === 'adrift') {
      rec.grp.rotation.y += Math.sin(state.time * 3 + m.id) * 0.15;
      rec.grp.rotation.z = Math.sin(state.time * 2.2 + m.id) * 0.3;
      rec.grp.position.y += Math.sin(state.time * 4 + m.id) * 0.06;
      // predicted drift line (§33G.5): where the wind will carry it
      if (!rec.driftLine) {
        const mat = new THREE.LineDashedMaterial({ color: 0xd9534f, dashSize: 0.18, gapSize: 0.14, transparent: true, opacity: 0.85 });
        rec.driftLine = new THREE.Line(new THREE.BufferGeometry(), mat);
        R.scene.add(rec.driftLine);
      }
      const pts = [];
      let px = m.pos[0], pz = m.pos[1];
      for (let i = 0; i <= 8; i++) {
        pts.push(new THREE.Vector3(worldX(px), moverY(m), worldZ(pz)));
        const w = state.wind.at(px, pz);
        px += w.x * 0.5; pz += w.z * 0.5;
      }
      rec.driftLine.geometry.setFromPoints(pts);
      rec.driftLine.computeLineDistances();
      rec.driftLine.visible = true;
    } else {
      rec.grp.rotation.z = 0;
      if (rec.driftLine) rec.driftLine.visible = false;
    }
    // hydrogen fleets fly visibly larger envelopes (§33E)
    if (m.kind === 'hauler' && m.owner === 'A') {
      const scale = state.hydrogen.A ? 1.3 : 1.0;
      rec.grp.scale.setScalar(scale);
      // venting tell below threshold (§33C.5)
      if (rec.grp.userData !== undefined && m.hull < CONFIG.Airship.VENT_THRESHOLD) {
        rec.grp.children.forEach(ch => { if (ch.material && ch.material.color) ch.material.opacity = 0.6 + 0.3 * Math.sin(state.time * 10); });
      }
    }
  }
  for (const [id, rec] of R.craftMeshes) {
    if (!seen.has(id)) {
      R.scene.remove(rec.grp);
      if (rec.driftLine) R.scene.remove(rec.driftLine);
      R.craftMeshes.delete(id);
    }
  }
}

// ---- Great Temple health bars + threat warning (§30: temple threatened
// -> strong edge warning) ----
function syncGreatTemples(state) {
  if (!R.gtBars) {
    R.gtBars = {};
    for (const side of ['A', 'P']) {
      const gt = state.greatTemple[side];
      const back = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 0.09, 0.14),
        new THREE.MeshBasicMaterial({ color: 0x10151a, transparent: true, opacity: 0.7 }));
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(1.06, 0.1, 0.1),
        new THREE.MeshBasicMaterial({ color: side === 'A' ? Palette.gold : Palette.poseidonGlow }));
      back.position.set(worldX(gt.cell[0]), 1.7, worldZ(gt.cell[1]));
      bar.position.copy(back.position);
      R.scene.add(back, bar);
      R.gtBars[side] = { bar, back, max: gt.hp };
    }
  }
  for (const side of ['A', 'P']) {
    const gt = state.greatTemple[side];
    const rec = R.gtBars[side];
    const frac = clamp(gt.hp / rec.max, 0, 1);
    rec.bar.scale.x = Math.max(0.001, frac);
    rec.bar.visible = rec.back.visible = frac < 1;
    if (side === 'P') {
      // enemy bar obeys fog memory: show only if his temple was ever seen
      const seen = state.vision.A.has(cellKey(gt.cell[0], gt.cell[1])) || state.memory.A.has('gtP');
      if (state.vision.A.has(cellKey(gt.cell[0], gt.cell[1]))) state.memory.A.set('gtP', state.time);
      rec.bar.visible = rec.back.visible = rec.bar.visible && seen;
    }
  }
  // edge warning while the home temple is under recent fire
  const hud = document.getElementById('hud');
  if (hud) {
    const threatened = state.time - (state.gtaLastHit || -99) < 2.5;
    hud.style.boxShadow = threatened ? 'inset 0 0 60px 18px rgba(217,83,79,0.55)' : '';
  }
}

// ---- island economy indicators: reserve bar + stockpile heap ----
const ALLEGIANCE_BASE = { A: 0xc9a05e, P: 0x2e6b74, N: 0xd8c9a8 };
function syncIslandBars(state) {
  for (const isl of state.map.islands) {
    if (isl.beachMat) {
      isl.beachMat.color.setHex(ALLEGIANCE_BASE[isl.owner || 'N']);
    }
  }
  for (const isl of state.map.islands) {
    if (isl.role.startsWith('greatTemple')) continue;
    let rec = R.islandBars.get(isl.id);
    if (!rec) {
      const heap = new THREE.Mesh(
        new THREE.ConeGeometry(0.22, 0.3, 7),
        new THREE.MeshLambertMaterial({ color: Palette.gold }));
      const [hx, hz] = isl.cells[0];
      heap.position.set(worldX(hx), CONFIG.Render.ISLAND_HEIGHT, worldZ(hz));
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 0.05, 0.08),
        new THREE.MeshBasicMaterial({ color: 0x76d09a }));
      bar.position.set(worldX(isl.center[0]), CONFIG.Render.ISLAND_HEIGHT + 0.7, worldZ(isl.center[1]));
      R.scene.add(heap, bar);
      rec = { heap, bar, baseReserve: isl.reserve };
      R.islandBars.set(isl.id, rec);
    }
    const stockScale = clamp(isl.stockpile / 40, 0.001, 1.4);
    rec.heap.scale.setScalar(stockScale);
    rec.heap.visible = isl.stockpile > 0.5;
    const frac = rec.baseReserve > 0 ? isl.reserve / rec.baseReserve : 0;
    rec.bar.scale.x = Math.max(0.02, frac);
    rec.bar.visible = !!isl.owner && !isl.minedOut;
    rec.bar.material.color.setHex(isl.owner === 'A' ? 0x76d09a : 0x4fb6c4);
  }
}

// ---- transient effects ----
function fxSpawn(state, kind, pos, data) {
  R.fx.push({ kind, pos: pos.slice(), t0: state.time, data: data || {} });
}

function initFxEvents(state) {
  // combat tracers: Aeolus drops ballast jars (gold, falling), Poseidon
  // throws the sea upward (teal, rising); impacts flash at the target
  const tracer = (payload, poseidon) => {
    const { from, to, targetSide, kind } = payload;
    const ya = poseidon ? 0.25 : 1.05;
    const yb = targetSide === 'A' ? (kind === 'segment' ? CONFIG.Render.AIR_ALTITUDE : 0.9) : 0.25;
    fxSpawn(state, 'tracer', from, { to: to.slice(), ya, yb, color: poseidon ? Palette.poseidonGlow : 0xffd977 });
  };
  Events.on('gunFired', (p) => tracer(p, p.side === 'P'));
  Events.on('craftFired', (p) => tracer(p, true));
  Events.on('structureDestroyed', ({ st }) => fxSpawn(state, 'boom', st.cell));
  Events.on('segmentDestroyed', ({ seg, cause }) => {
    fxSpawn(state, cause === 'collapse' ? 'unravel' : 'boom', segMid(seg), { air: seg.owner === 'A' });
  });
  Events.on('convoyLost', ({ ent }) => fxSpawn(state, 'wreck', ent.pos));
  Events.on('tidalSurge', ({ center }) => fxSpawn(state, 'surge', center));
  Events.on('fogBank', ({ center }) => fxSpawn(state, 'fogbank', center));
  Events.on('windwall', ({ cell }) => fxSpawn(state, 'windwall', cell));
  Events.on('greatTempleHit', ({ side }) => {
    const gt = state.greatTemple[side];
    if (Math.random() < 0.05) fxSpawn(state, 'boom', gt.cell);
  });
}

function fxTick(state, dt) {
  for (const f of R.fx) {
    const age = state.time - f.t0;
    if (!f.mesh) {
      let mesh = null;
      if (f.kind === 'boom') {
        mesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6),
          new THREE.MeshBasicMaterial({ color: 0xffc16e, transparent: true, opacity: 0.9 }));
      } else if (f.kind === 'unravel') {
        mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 6, 5),
          new THREE.MeshBasicMaterial({ color: f.data.air ? 0xf2e8cf : 0x7fd4dd, transparent: true, opacity: 0.7 }));
      } else if (f.kind === 'wreck') {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.05, 0.15),
          new THREE.MeshLambertMaterial({ color: 0x6b5b45 }));
      } else if (f.kind === 'surge') {
        mesh = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.9, 24),
          new THREE.MeshBasicMaterial({ color: 0x7fd4dd, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
        mesh.rotation.x = -Math.PI / 2;
      } else if (f.kind === 'fogbank') {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(CONFIG.Powers.FOG_BANK.RADIUS, CONFIG.Powers.FOG_BANK.RADIUS, 0.3, 20),
          new THREE.MeshBasicMaterial({ color: 0xb8c4c6, transparent: true, opacity: 0.25 }));
      } else if (f.kind === 'windwall') {
        mesh = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 8),
          new THREE.MeshBasicMaterial({ color: 0xfff3cf, transparent: true, opacity: 0.25 }));
      } else if (f.kind === 'tracer') {
        const d = f.data;
        const ax = worldX(f.pos[0]), az = worldZ(f.pos[1]);
        const bx = worldX(d.to[0]), bz = worldZ(d.to[1]);
        const dx = bx - ax, dy = d.yb - d.ya, dz = bz - az;
        const len = Math.max(0.01, Math.hypot(dx, dy, dz));
        mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.022, 0.022, len, 5),
          new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.85 }));
        mesh.position.set((ax + bx) / 2, (d.ya + d.yb) / 2, (az + bz) / 2);
        mesh.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(dx / len, dy / len, dz / len));
        // impact spark
        const spark = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 5),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
        spark.position.set(bx, d.yb, bz);
        mesh.add(new THREE.Group());   // keep child indices stable
        R.scene.add(spark);
        f.spark = spark;
      }
      const y = f.kind === 'wreck' || f.kind === 'surge' ? 0.04 : (f.data.air ? CONFIG.Render.AIR_ALTITUDE : 0.3);
      mesh.position.set(worldX(f.pos[0]), y, worldZ(f.pos[1]));
      R.scene.add(mesh);
      f.mesh = mesh;
    }
    const life = f.kind === 'wreck' ? 20 : f.kind === 'fogbank' ? CONFIG.Powers.FOG_BANK.DURATION
      : f.kind === 'windwall' ? CONFIG.Powers.WIND_WALL.DURATION : f.kind === 'surge' ? 1.4
      : f.kind === 'tracer' ? 0.2 : 0.8;
    if (age > life) {
      R.scene.remove(f.mesh);
      if (f.spark) R.scene.remove(f.spark);
      f.dead = true;
      continue;
    }
    if (f.kind === 'tracer') {
      f.mesh.material.opacity = 0.85 * (1 - age / life);
      if (f.spark) f.spark.material.opacity = 0.9 * (1 - age / life);
      continue;
    }
    if (f.kind === 'boom' || f.kind === 'unravel') {
      f.mesh.scale.setScalar(1 + age * 3);
      f.mesh.material.opacity = Math.max(0, 0.9 * (1 - age / life));
    } else if (f.kind === 'surge') {
      f.mesh.scale.setScalar(1 + age * 4);
      f.mesh.material.opacity = Math.max(0, 0.7 * (1 - age / life));
    } else if (f.kind === 'wreck') {
      f.mesh.rotation.y += dt * 0.3;
      f.mesh.material.opacity = 1;
    }
  }
  R.fx = R.fx.filter(f => !f.dead);
}

// ghost of a structure while the player decides (RAISE / cancel)
function showStructPreview(state, side, type, cell) {
  R.previewGroup.clear();
  const onLand = !!islandAt(state, cell[0], cell[1]);
  const grp = new THREE.Group();
  const chassis = type === 'temple' || type === 'yard' ? new THREE.Group() : makeChassis(side, onLand);
  const payload = makePayload(side, type, null);
  grp.add(chassis, payload);
  grp.traverse(o => {
    if (o.material) {
      o.material = o.material.clone();
      o.material.transparent = true;
      o.material.opacity = 0.45;
    }
  });
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.34, 0.46, 24),
    new THREE.MeshBasicMaterial({ color: Palette.socket, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.06;
  grp.add(ring);
  const baseY = onLand ? CONFIG.Render.ISLAND_HEIGHT : (side === 'A' ? CONFIG.Render.AIR_ALTITUDE - 0.6 : 0);
  grp.position.set(worldX(cell[0]), baseY, worldZ(cell[1]));
  R.previewGroup.add(grp);
}

// ---- exploration shroud: unexplored terrain is dark until the player's
// reach (structures, corridors, ships) lifts it. One-way. ----
R.shroud = new Map();

function buildShroud(state) {
  for (const m of R.shroud.values()) R.scene.remove(m);
  R.shroud.clear();
  const geo = new THREE.BoxGeometry(1.02, 1.7, 1.02);
  const opaque = CONFIG.Render.SHROUD_OPACITY >= 1;
  const mat = new THREE.MeshBasicMaterial({
    color: 0x060f14, transparent: !opaque, opacity: CONFIG.Render.SHROUD_OPACITY
  });
  for (let z = 0; z < CONFIG.Grid.HEIGHT; z++) {
    for (let x = 0; x < CONFIG.Grid.WIDTH; x++) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(worldX(x), 0.85, worldZ(z));
      R.scene.add(m);
      R.shroud.set(cellKey(x, z), m);
    }
  }
}

function syncShroud(state) {
  const lift = (k) => {
    const m = R.shroud.get(k);
    if (m) {
      R.scene.remove(m);
      R.shroud.delete(k);
    }
  };
  // ground once seen stays lifted — and ground inside your influence is
  // always lifted, because influence is exactly where you may build
  if (state.explored) for (const k of state.explored) lift(k);
  for (const k of state.influence.A) lift(k);
}

// enemy segment fog handling is layered onto syncSegments via this hook
function segmentVisibility(state, s) {
  if (s.owner === 'A') return 'full';
  const m = segMid(s);
  if (state.vision.A.has(cellKey(Math.round(m[0]), Math.round(m[1])))) return 'full';
  if (state.memory.A.has('seg:' + s.key)) return 'dim';
  return 'hidden';
}

// ============================================================
// UI

// ================================================================
// UI — DOM HUD, hand of pieces, tap-driven placement (§8.1).
// Tap piece -> sockets light -> tap socket -> preview -> tap preview
// to cycle -> CONFIRM. Cancel by tapping elsewhere. No dragging.
// ================================================================

const UI = {
  mode: 'idle',            // idle | placing
  pieceIdx: -1,
  socket: null,
  placements: [],
  orient: 0,
  els: {}
};

function initUI(state) {
  const $ = id => document.getElementById(id);
  UI.els = {
    supply: $('supply'), favor: $('favor'), seedchip: $('seedchip'), waveinfo: $('waveinfo'),
    hand: $('hand'), confirm: $('btn-confirm'), cancel: $('btn-cancel'), rotate: $('btn-rotate'),
    discard: $('btn-discard'), tech: $('btn-tech'),
    banner: $('banner'), tutorial: $('tutorial'), ticker: $('ticker'),
    powTailwind: $('pow-tailwind'), powWindwall: $('pow-windwall'),
    priestchip: $('priestchip'), buildmenu: $('buildmenu'), codex: $('codex')
  };
  UI.els.seedchip.textContent = state.seed;

  buildHand(state);

  UI.els.confirm.addEventListener('click', () => confirmPlacement(state));
  UI.els.rotate.addEventListener('click', () => cyclePlacement(state));
  UI.els.cancel.addEventListener('click', () => cancelPlacement());
  UI.els.discard.addEventListener('click', () => discardPiece(state));
  UI.els.tech.addEventListener('click', () => {
    if (buyHydrogen(state, 'A')) {
      showBanner('THE LIGHT AIR', 'Iron filings and sour wine. The fleet is reborn.');
      UI.els.tech.disabled = true;
    } else flashTicker('NEEDS 25 SUPPLY AND 6 FAVOR');
  });
  UI.els.powTailwind.addEventListener('click', () => {
    if (!castTailwind(state)) flashTicker('NOT ENOUGH FAVOR');
  });
  UI.els.powWindwall.addEventListener('click', () => {
    if (state.res.A.favor < CONFIG.Powers.WIND_WALL.FAVOR) { flashTicker('NOT ENOUGH FAVOR'); return; }
    UI.windwallArmed = !UI.windwallArmed;
    UI.els.powWindwall.classList.toggle('armed', UI.windwallArmed);
    if (UI.windwallArmed) flashTicker('TAP AN ENDPOINT TO SHELTER');
  });
  UI.els.priestchip.classList.remove('hidden');
  UI.els.priestchip.addEventListener('click', () => {
    const p = state.priests.A;
    if (p) panCameraTo(worldX(p.pos[0]), worldZ(p.pos[1]));
  });

  // pan vs tap: a drag beyond the threshold pans the camera; a clean
  // press-and-release is a tap
  const canvas = R.renderer.domElement;
  const pan = { active: false, panned: false, sx: 0, sy: 0, ground: null };
  const pointers = new Map();     // two-finger pinch (zoom) and twist (rotate)
  let pinch = null;
  const gestureVals = () => {
    const [a, b] = [...pointers.values()];
    return {
      d: Math.hypot(a.x - b.x, a.y - b.y),
      ang: Math.atan2(b.y - a.y, b.x - a.x)
    };
  };
  canvas.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const g = gestureVals();
      pinch = { d0: g.d, a0: g.ang, zoom0: R.camZoom || 1, az0: R.camAz || 0 };
      pan.active = false;
      pan.panned = true;   // suppress the tap on release
      return;
    }
    pan.active = true;
    pan.panned = false;
    pan.sx = e.clientX; pan.sy = e.clientY;
    pan.ground = pickGround(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const g = gestureVals();
      R.camZoom = clamp(pinch.zoom0 * (pinch.d0 / Math.max(20, g.d)), 0.75, 2.6);
      let da = g.ang - pinch.a0;
      R.camAz = pinch.az0 + da;
      updateCamera();
      return;
    }
    if (!pan.active) return;
    const moved = Math.hypot(e.clientX - pan.sx, e.clientY - pan.sy);
    if (!pan.panned && moved < CONFIG.Render.TAP_DRAG_THRESHOLD_PX) return;
    pan.panned = true;
    if (!pan.ground) return;
    const now = pickGround(e.clientX, e.clientY);
    if (!now) return;
    R.camTarget.x = R.camTarget.x + (pan.ground.x - now.x);
    R.camTarget.z = R.camTarget.z + (pan.ground.z - now.z);
    updateCamera();
    pan.ground = pickGround(e.clientX, e.clientY);
  });
  const release = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    const wasTap = pan.active && !pan.panned && e.type === 'pointerup';
    pan.active = false;
    if (wasTap) onTap(state, e);
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
}

// ---- hand ----
function drawPieceIcon(canvas, type) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  ctx.clearRect(0, 0, s, s);
  ctx.strokeStyle = '#f2e8cf';
  ctx.lineWidth = s / 9;
  ctx.lineCap = 'round';
  const u = s / 4.4;
  const cx = s / 2, cy = s / 2;
  ctx.beginPath();
  const seg = (a, b) => { ctx.moveTo(cx + a[0] * u, cy + a[1] * u); ctx.lineTo(cx + b[0] * u, cy + b[1] * u); };
  for (const [a, b] of PIECE_TEMPLATES[type]) seg([a[0], a[1] + 1.5], [b[0], b[1] + 1.5]);
  ctx.stroke();
}

function buildHand(state) {
  UI.els.hand.innerHTML = '';
  state.hand.forEach((type, i) => {
    const btn = document.createElement('button');
    btn.className = 'piece';
    const cv = document.createElement('canvas');
    cv.width = cv.height = 44;
    drawPieceIcon(cv, type);
    const cost = document.createElement('span');
    cost.className = 'cost';
    cost.textContent = pieceCost(type) + ' ⚇';
    btn.appendChild(cv);
    btn.appendChild(cost);
    btn.addEventListener('click', () => selectPiece(state, i));
    UI.els.hand.appendChild(btn);
  });
  refreshHand(state);
}

function refreshHand(state) {
  [...UI.els.hand.children].forEach((btn, i) => {
    btn.classList.toggle('selected', UI.mode === 'placing' && UI.pieceIdx === i);
    btn.classList.toggle('unaffordable', state.res.A.supply < pieceCost(state.hand[i]));
  });
  UI.els.discard.disabled = !(UI.mode === 'placing' && state.res.A.favor >= CONFIG.Economy.REROLL_FAVOR);
}

// ---- placement flow ----
function selectPiece(state, i) {
  if (state.over) return;
  if (state.res.A.supply < pieceCost(state.hand[i])) { flashTicker('NOT ENOUGH SUPPLY'); return; }
  UI.mode = 'placing';
  UI.pieceIdx = i;
  UI.socket = null;
  UI.placements = [];
  clearPreview();
  const sockets = getSockets(state, 'A').filter(s => legalPlacements(state, 'A', state.hand[i], s).length);
  showSockets(state, sockets);
  setConfirmVisible(false);
  refreshHand(state);
  if (!sockets.length) {
    flashTicker('NOWHERE TO BUILD FROM — EXTEND ANOTHER WAY');
  } else if (sockets.length === 1) {
    // only one place it can go (the opening move): step straight to preview
    selectSocket(state, sockets[0]);
    flashTicker('TAP THE GHOST TO TURN IT · CONFIRM TO BIND');
  } else {
    flashTicker('TAP A GLOWING SOCKET');
  }
  Events.emit('uiSelectPiece', {});
}

function selectSocket(state, socket) {
  const type = state.hand[UI.pieceIdx];
  const placements = legalPlacements(state, 'A', type, socket);
  if (!placements.length) return false;
  UI.socket = socket;
  UI.placements = placements;
  UI.orient = 0;
  showPreview(state, placements[0].segs, true);
  setConfirmVisible(true);
  updateGhostMultiplier(state);
  if (!UI.hintedCycle) {
    UI.hintedCycle = true;
    flashTicker('TAP THE GHOST TO TURN IT · CONFIRM TO BIND');
  }
  return true;
}

function cyclePlacement(state) {
  if (!UI.placements.length) return;
  UI.orient = (UI.orient + 1) % UI.placements.length;
  showPreview(state, UI.placements[UI.orient].segs, true);
  updateGhostMultiplier(state);
  Events.emit('uiCycle', {});
}

// the placement ghost shows its wind multiplier before commit (§21A.5)
function updateGhostMultiplier(state) {
  const p = UI.placements[UI.orient];
  if (!p) return;
  let sum = 0;
  for (const [a, b] of p.segs) {
    const dx = b[0] - a[0], dz = b[1] - a[1];
    const len = Math.hypot(dx, dz) || 1;
    sum += state.wind.multiplier((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, dx / len, dz / len, true);
  }
  const avg = sum / p.segs.length;
  UI.els.confirm.textContent = 'CONFIRM  ×' + avg.toFixed(2);
}

function confirmPlacement(state) {
  if (UI.structMode) {
    const { type, at } = UI.structMode;
    const why = whyNotBuild(state, 'A', type, at);
    if (why) { flashTicker(why); cancelPlacement(); return; }
    buildStructure(state, 'A', type, at);
    cancelPlacement();
    return;
  }
  if (UI.mode !== 'placing' || !UI.placements.length) return;
  const type = state.hand[UI.pieceIdx];
  if (placePiece(state, 'A', type, UI.placements[UI.orient].segs)) {
    state.hand[UI.pieceIdx] = drawPiece();
    buildHand(state);
    refreshInfluenceView(state);
  }
  cancelPlacement();
}

function cancelPlacement() {
  UI.mode = 'idle';
  UI.pieceIdx = -1;
  UI.socket = null;
  UI.placements = [];
  UI.structMode = null;
  clearSockets();
  clearPreview();
  setConfirmVisible(false);
}

function discardPiece(state) {
  if (UI.mode !== 'placing') return;
  if (state.res.A.favor < CONFIG.Economy.REROLL_FAVOR) return;
  state.res.A.favor -= CONFIG.Economy.REROLL_FAVOR;
  state.hand[UI.pieceIdx] = drawPiece();
  buildHand(state);
  cancelPlacement();
}

function setConfirmVisible(v) {
  UI.els.confirm.classList.toggle('hidden', !v);
  UI.els.cancel.classList.toggle('hidden', !v);
  // TURN only shows when the piece has more than one legal orientation here
  UI.els.rotate.classList.toggle('hidden', !v || !UI.placements || UI.placements.length < 2);
  if (v) UI.els.confirm.textContent = 'CONFIRM';
}

// ---- taps on the world ----
function onTap(state, e) {
  if (state.over) return;
  const cell = pickCell(e.clientX, e.clientY);
  if (UI.mode === 'placing') {
    if (!cell) { cancelPlacement(); refreshHand(state); return; }
    // tapping the previewed piece cycles orientation
    if (UI.placements.length && UI.placements[UI.orient].segs.some(([a, b]) =>
      (a[0] === cell[0] && a[1] === cell[1]) || (b[0] === cell[0] && b[1] === cell[1]))) {
      cyclePlacement(state);
      return;
    }
    // tapping a lit socket
    const sockets = getSockets(state, 'A');
    const hit = sockets.find(s => s.cell[0] === cell[0] && s.cell[1] === cell[1]);
    if (hit && selectSocket(state, hit)) return;
    // elsewhere: cancel
    cancelPlacement();
    refreshHand(state);
    return;
  }
  hideBuildMenu();
  if (UI.structMode) { cancelPlacement(); return; }
  if (!cell) return;

  // armed Wind Wall aims at the tapped endpoint (§19.1)
  if (UI.windwallArmed) {
    UI.windwallArmed = false;
    UI.els.powWindwall.classList.remove('armed');
    castWindWall(state, cell);
    return;
  }
  openContextMenu(state, cell);
}

// ---- build menu / island actions ----
function hideBuildMenu() { UI.els.buildmenu.classList.add('hidden'); }

function menuButton(label, cost, fn, disabledReason) {
  const btn = document.createElement('button');
  btn.innerHTML = label + (cost ? '<b>' + cost + ' ⚇</b>' : '');
  if (disabledReason) {
    // still tappable: a tap explains WHY it is refused (mobile has no tooltips)
    btn.style.opacity = 0.4;
    btn.addEventListener('click', () => flashTicker(disabledReason));
  } else {
    btn.addEventListener('click', () => { fn(); hideBuildMenu(); });
  }
  return btn;
}

function openContextMenu(state, cell) {
  const [x, z] = cell;
  const menu = UI.els.buildmenu;
  menu.innerHTML = '';
  const options = [];
  const isl = islandAt(state, x, z);
  const plotIdx = isl ? isl.plots.findIndex(p => p.x === x && p.z === z) : -1;
  const deg = nodeDegrees(state, 'A').get(cellKey(x, z)) || 0;

  // arming a build shows a ghost at the site; CONFIRM raises it (§8.1 rhythm)
  const tryBuild = (type, at) => () => {
    const why = whyNotBuild(state, 'A', type, at);
    if (why) { flashTicker(why); return; }
    UI.structMode = { type, at };
    showStructPreview(state, 'A', type, at.cell);
    setConfirmVisible(true);
    UI.els.confirm.textContent = 'RAISE  ' + structureStats('A', type).cost + ' ⚇';
  };

  if (!isl && deg === 1 && !structureAt(state, x, z)) {
    const at = { site: 'endpoint', cell };
    for (const [type, label] of [['vane', 'CHAIN<br>VANE'], ['bolt', 'BOLT<br>BATTERY'], ['shield', 'AEGIS<br>SCREEN']]) {
      const why = whyNotBuild(state, 'A', type, at);
      options.push(menuButton(label, structureStats('A', type).cost, tryBuild(type, at), why));
    }
  } else if (isl && plotIdx >= 0) {
    const at = { site: 'plot', islandId: isl.id, plotIdx, cell };
    if (!isl.role.startsWith('greatTemple') && (!isl.temple || isl.temple.hp <= 0)) {
      options.push(menuButton('TEMPLE', CONFIG.Structures.TEMPLE.COST, tryBuild('temple', at),
        whyNotBuild(state, 'A', 'temple', at)));
    }
    if (isl.owner === 'A') {
      for (const [type, label] of [['vane', 'CHAIN<br>VANE'], ['bolt', 'BOLT<br>BATTERY'], ['shield', 'AEGIS<br>SCREEN'], ['yard', 'MOORING<br>YARD']]) {
        const why = whyNotBuild(state, 'A', type, at);
        options.push(menuButton(label, structureStats('A', type).cost, tryBuild(type, at), why));
      }
    }
  } else if (isl) {
    // island body: offer builds on the first free plot too, so the player
    // doesn't have to hit the small bronze disc exactly
    const freeIdx = isl.plots.findIndex(pl => !pl.structure);
    if (freeIdx >= 0) {
      const at = { site: 'plot', islandId: isl.id, plotIdx: freeIdx, cell: [isl.plots[freeIdx].x, isl.plots[freeIdx].z] };
      if (!isl.role.startsWith('greatTemple') && (!isl.temple || isl.temple.hp <= 0)) {
        options.push(menuButton('TEMPLE', CONFIG.Structures.TEMPLE.COST, tryBuild('temple', at),
          whyNotBuild(state, 'A', 'temple', at)));
      }
      if (isl.owner === 'A') {
        for (const [type, label] of [['vane', 'CHAIN<br>VANE'], ['bolt', 'BOLT<br>BATTERY'], ['shield', 'AEGIS<br>SCREEN'], ['yard', 'MOORING<br>YARD']]) {
          const why = whyNotBuild(state, 'A', type, at);
          options.push(menuButton(label, structureStats('A', type).cost, tryBuild(type, at), why));
        }
      }
    }
    // priest travel, hauler purchase at home/yarded islands
    const p = state.priests.A;
    const reachable = p && findNetPath(state, 'A', [Math.round(p.pos[0]), Math.round(p.pos[1])], isl.cells);
    options.push(menuButton('SEND<br>PRIEST', 0, () => {
      if (!sendPriest(state, 'A', isl)) flashTicker('NO SUPPORTED ROUTE REACHES IT');
    }, reachable ? null : 'NO SUPPORTED ROUTE REACHES IT'));
    const hasYard = isl.role === 'greatTempleA' ||
      state.structures.some(st => st.owner === 'A' && st.type === 'yard' && st.islandId === isl.id && st.hp > 0 && st.buildProgress >= 1);
    if (hasYard) {
      const fleet = state.haulers.filter(h => h.owner === 'A' && h.state !== 'dead').length;
      const capped = fleet >= fleetCap(state, 'A');
      options.push(menuButton('BUILD<br>HAULER', CONFIG.Hauler.COST, () => {
        if (!buyHauler(state, 'A')) flashTicker('FLEET AT CAPACITY');
      }, capped ? 'FLEET AT CAPACITY' : (state.res.A.supply < CONFIG.Hauler.COST ? 'NOT ENOUGH SUPPLY' : null)));
    }
  }

  if (!options.length) return;
  for (const o of options) menu.appendChild(o);
  menu.classList.remove('hidden');
}

// ---- HUD refresh ----
function refreshHUD(state) {
  UI.els.supply.textContent = Math.floor(state.res.A.supply);
  UI.els.favor.textContent = Math.floor(state.res.A.favor);
  const w = state.wave;
  if (state.over) UI.els.waveinfo.textContent = '';
  else if (w.index >= CONFIG.Waves.COUNT) UI.els.waveinfo.textContent = 'THE LAST TIDE HAS PASSED';
  else {
    const remain = Math.max(0, w.nextAt - state.time);
    UI.els.waveinfo.textContent = 'WAVE ' + (w.index + 1) + ' IN ' + Math.ceil(remain) + 's';
  }
  // priest chip (§14.8.6)
  const p = state.priests.A;
  if (p) {
    const label = p.state === 'dead' ? 'SUCCESSION ' + Math.max(0, Math.ceil(p.respawnAt - state.time)) + 's'
      : p.state === 'adrift' ? 'ADRIFT'
      : p.state === 'consecrating' ? 'CONSECRATING'
      : p.state === 'transit' ? 'UNDER WAY'
      : 'READY';
    UI.els.priestchip.innerHTML = '&#9865; PRIEST<br>' + label;
    UI.els.priestchip.classList.toggle('adrift', p.state === 'adrift' || p.state === 'dead');
  }
  // adrift fleet counter (§33G.5)
  const adrift = state.haulers.filter(h => h.owner === 'A' && h.state === 'adrift').length;
  if (adrift > 0 && !UI.lastAdrift) flashTicker('ADRIFT ×' + adrift);
  UI.lastAdrift = adrift;
  UI.els.tech.disabled = state.hydrogen.A;
  UI.els.powTailwind.disabled = state.res.A.favor < CONFIG.Powers.TAILWIND.FAVOR || state.time < state.powers.tailwindUntil;
  UI.els.powWindwall.disabled = state.res.A.favor < CONFIG.Powers.WIND_WALL.FAVOR && !UI.windwallArmed;
  refreshHand(state);
}

// ---- banners / tutorial / ticker ----
let bannerTimeout = null;
function showBanner(title, sub, poseidon) {
  const b = UI.els.banner;
  b.querySelector('.title').textContent = title;
  b.querySelector('.sub').textContent = sub || '';
  b.classList.toggle('poseidon', !!poseidon);
  b.classList.add('show');
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => b.classList.remove('show'), 4200);
}

let tutorialTimeout = null;
function showTutorialLine(text, holdMs) {
  const t = UI.els.tutorial;
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(tutorialTimeout);
  if (holdMs) tutorialTimeout = setTimeout(() => t.classList.remove('show'), holdMs);
}
function hideTutorialLine() { UI.els.tutorial.classList.remove('show'); }

let tickerTimeout = null;
function flashTicker(text) {
  UI.els.ticker.textContent = text;
  UI.els.ticker.classList.add('show');
  clearTimeout(tickerTimeout);
  tickerTimeout = setTimeout(() => UI.els.ticker.classList.remove('show'), 2600);
}

// ================================================================
// MAIN — boot, match lifecycle, the frame loop.
// ================================================================

let STATE = null;
let lastFrame = 0;

function startMatch(seedStr) {
  Events.clear();
  STATE = newGameState(seedStr);
  recalcSupport(STATE, 'A');
  recalcSupport(STATE, 'P');
  refreshInfluence(STATE);

  if (!R.initialized) initRenderer();
  else {
    for (const m of R.segMeshes.values()) R.scene.remove(m);
    R.segMeshes.clear();
    for (const rec of R.structMeshes.values()) R.scene.remove(rec.grp);
    R.structMeshes.clear();
    for (const rec of R.craftMeshes.values()) R.scene.remove(rec.grp);
    R.craftMeshes.clear();
    for (const rec of R.islandBars.values()) { R.scene.remove(rec.heap); R.scene.remove(rec.bar); }
    R.islandBars.clear();
    for (const f of R.fx) if (f.mesh) R.scene.remove(f.mesh);
    R.fx = [];
    for (const c of R.whitecaps) R.scene.remove(c.mesh);
    for (const s of R.smoke) R.scene.remove(s.mesh);
  }
  buildMapMeshes(STATE);
  buildShroud(STATE);
  refreshInfluenceView(STATE);

  // opening state: a priest and one hauler on each side (§14.7.6, §14.8)
  spawnPriest(STATE, 'A');
  spawnPriest(STATE, 'P');
  for (let i = 0; i < CONFIG.Hauler.START_COUNT; i++) {
    spawnHauler(STATE, 'A');
    spawnHauler(STATE, 'P');
  }

  initAI(STATE);
  initFlow(STATE);
  initFxEvents(STATE);
  wireAudio();
  initUI(STATE);
  initCodex(STATE);
  wireGameEvents(STATE);
  fogTick(STATE, 1);

  // open on the home temple; the map scrolls (drag to pan)
  const gt = STATE.greatTemple.A.cell;
  panCameraTo(worldX(gt[0]), worldZ(gt[1]) - 1.5);

  document.getElementById('startscreen').classList.add('hidden');
  document.getElementById('endscreen').classList.add('hidden');
}

function wireGameEvents(state) {
  Events.on('networkSevered', ({ side }) => {
    if (side === 'A' && !state.tutorial.seenSever) {
      state.tutorial.seenSever = true;
      showTutorialLine('“The binding is cut. Take another path before the wind remembers.”', 6000);
    }
  });
  Events.on('networkRestored', ({ side }) => {
    if (side === 'A') showBanner('NETWORK RESTORED', 'The wind remembers its road.');
    refreshInfluenceView(state);
  });
  Events.on('segmentDestroyed', () => refreshInfluenceView(state));
  Events.on('piecePlaced', ({ side }) => { if (side === 'P') refreshInfluenceView(state); });
  Events.on('islandClaimed', () => refreshInfluenceView(state));
  Events.on('templeFallen', () => refreshInfluenceView(state));
  Events.on('structureComplete', () => refreshInfluenceView(state));
  Events.on('hydrogenUnlocked', ({ side }) => { if (side === 'A') buildHand(state); });
}

function frame(t) {
  requestAnimationFrame(frame);
  if (!STATE) return;
  const dt = Math.min(0.1, (t - lastFrame) / 1000 || 0.016);
  lastFrame = t;
  const state = STATE;
  if (!state.over) {
    state.time += dt;
    state.wind.tick(dt);
    economyTick(state, dt);
    structuresTick(state, dt);
    updateTransit(state, dt);
    combatTick(state, dt);
    wavesTick(state, dt);
    aiTick(state, dt);
    fogTick(state, dt);
    collapseTick(state);
    flowTick(state);
  }
  refreshHUD(state);
  syncStructures(state);
  syncMovers(state);
  syncIslandBars(state);
  syncGreatTemples(state);
  syncShroud(state);
  fxTick(state, dt);
  renderTick(state, dt);
}

// Dev handle (also used by the hidden tuning overlay; harmless to ship).
if (typeof window !== 'undefined') {
  Object.defineProperty(window, 'WD', { get: () => ({ state: STATE, startMatch }) });
}

  'For generations the escaped winds have tangled around these islands, snagging on headlands, rushing the straits. The sea stayed the only road — and every crossing paid Poseidon its honour.',
  'Then the shipwrights found the light air: iron filings and sour wine, sealed in a bronze retort, give off an air that will not stay down. Lift was worked out in a foundry. No god was consulted.',
  'But lift is not travel. A full envelope rises, then goes wherever the sky is going. To steer, a crew must bind a wind — and the only winds loose here are Aeolus’ own.',
  'So the guild took a patron. They keep his rites; he grants the currents. And Poseidon watches cargo cross without asking him for calm water. He is not insulted. He is being forgotten.'
];
let loreIdx = 0, loreTimer = null;
function cycleLore() {
  const el = document.getElementById('lorecycle');
  if (!el || document.getElementById('startscreen').classList.contains('hidden')) return;
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = INTRO_LORE[loreIdx % INTRO_LORE.length];
    el.style.opacity = 1;
    loreIdx++;
  }, 700);
  loreTimer = setTimeout(cycleLore, 8000);
}

// ---- boot ----
window.addEventListener('DOMContentLoaded', () => {
  const seedInput = document.getElementById('seedinput');
  seedInput.value = makeSeedString();
  cycleLore();
  document.getElementById('startbtn').addEventListener('click', () => {
    audioInit();
    const seed = (seedInput.value || makeSeedString()).trim().toLowerCase();
    startMatch(seed);
  });
  document.getElementById('resetbtn').addEventListener('click', () => {
    startMatch(makeSeedString());
  });
  requestAnimationFrame(frame);
});

</script>
