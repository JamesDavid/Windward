      const target = pickCollectionTarget(state, side);
      if (target) {
        const path = findNetPath(state, side, [Math.round(h.pos[0]), Math.round(h.pos[1])], target.cells);
        if (path && path.length > 1) {
          h.targetIsland = target.id;
          h.path = path; h.legIndex = 0; h.legT = 0;
          h.state = 'toIsland';
        }
      }
      break;
    }
    case 'toIsland': {
      const r = advanceOnPath(state, h, dt);
      if (r === 'adrift') { enterAdrift(state, h); break; }
      if (r === 'arrived') { h.state = 'dwelling'; h.timer = CONFIG.Hauler.DWELL_SECONDS; }
      break;
    }
    case 'dwelling': {
      h.timer -= dt;
      if (h.timer <= 0) {
        const isl = state.map.islands[h.targetIsland];
        const take = Math.min(h.capacity, Math.floor(isl ? isl.stockpile : 0));
        if (isl) isl.stockpile -= take;
        h.cargo = take;
        const home = state.greatTemple[side];
        const path = findNetPath(state, side, [Math.round(h.pos[0]), Math.round(h.pos[1])], [home.cell]);
        if (path) { h.path = path; h.legIndex = 0; h.legT = 0; h.state = 'toHome'; }
        else enterAdrift(state, h);   // road home is gone
      }
      break;
    }
    case 'toHome': {
      const r = advanceOnPath(state, h, dt);
      if (r === 'adrift') { enterAdrift(state, h); break; }
      if (r === 'arrived') { h.state = 'unloading'; h.timer = CONFIG.Hauler.UNLOAD_SECONDS; }
      break;
    }
    case 'unloading': {
      h.timer -= dt;
      if (h.timer <= 0) {
        state.res[side].supply += h.cargo;
        if (h.cargo > 0) Events.emit('delivery', { side, amount: h.cargo });
        h.cargo = 0;
        h.targetIsland = null;
        h.state = 'idle';
      }
      break;
    }
    case 'adrift': {
      const r = adriftTick(state, h, dt);
      if (r === 'lost') {
        h.state = 'dead';
        Events.emit('convoyLost', { ent: h });
      } else if (r === 'rebound') {
        h.state = h.cargo > 0 ? 'toHome' : 'idle';
        if (h.state === 'toHome') {
          const path = findNetPath(state, side, [Math.round(h.pos[0]), Math.round(h.pos[1])], [state.greatTemple[side].cell]);
          if (path) { h.path = path; h.legIndex = 0; h.legT = 0; }
          else h.state = 'idle';
        }
      }
      break;
    }
  }
}

// ---- the priest (§14.8) ----
function spawnPriest(state, side) {
  const p = {
    id: eid(), kind: 'priest', owner: side,
    pos: state.greatTemple[side].cell.slice(),
    hull: CONFIG.Priest.HULL, maxHull: CONFIG.Priest.HULL,
    state: 'idle',                 // idle | transit | consecrating | adrift | dead
    path: null, legIndex: 0, legT: 0,
    islandId: state.greatTemple[side].island.id,
    consecrating: null,            // {islandId, plot}
    respawnAt: 0, lastHitAt: -99
  };
  state.priests[side] = p;
  return p;
}

// Tap a destination island: refused unless the side's supported network
// reaches it (§14.8.2). Returns true when he sets sail.
function sendPriest(state, side, isl) {
  const p = state.priests[side];
  if (!p || p.state === 'dead' || p.state === 'consecrating' || p.state === 'adrift') return false;
  const path = findNetPath(state, side, [Math.round(p.pos[0]), Math.round(p.pos[1])], isl.cells);
  if (!path || path.length < 1) return false;
  p.path = path; p.legIndex = 0; p.legT = 0;
  p.state = 'transit';
  p.islandId = null;
  p.targetIslandId = isl.id;
  Events.emit('priestSails', { side });
  return true;
}

function priestOnIsland(state, side, isl) {
  const p = state.priests[side];
  if (!p || p.state === 'dead' || p.state === 'adrift' || p.state === 'transit') return false;
  return isl.cellSet.has(cellKey(Math.round(p.pos[0]), Math.round(p.pos[1])));
}

function updatePriest(state, side, dt) {
  const p = state.priests[side];
  if (!p) return;
  switch (p.state) {
    case 'transit': {
      const r = advanceOnPath(state, p, dt);
      if (r === 'adrift') { enterAdrift(state, p); break; }
      if (r === 'arrived') {
        p.state = 'idle';
        p.islandId = p.targetIslandId;
        Events.emit('priestArrived', { side });
      }
      break;
    }
    case 'consecrating': {
      const job = p.consecrating;
      const isl = state.map.islands[job.islandId];
      // interrupted? temple destroyed mid-build is handled by structures
      if (!isl.temple || isl.temple.owner !== side) { p.state = 'idle'; p.consecrating = null; break; }
      if (isl.temple.buildProgress >= 1) { p.state = 'idle'; p.consecrating = null; }
      break;
    }
    case 'adrift': {
      const r = adriftTick(state, p, dt);
      if (r === 'lost') {
        p.state = 'dead';
        p.respawnAt = state.time + CONFIG.Priest.SUCCESSION_SECONDS;
        Events.emit('priestDead', { side });
      } else if (r === 'rebound') {
        p.state = 'idle';
        const isl = islandAt(state, Math.round(p.pos[0]), Math.round(p.pos[1]));
        p.islandId = isl ? isl.id : null;
      }
      break;
    }
    case 'dead': {
      if (state.time >= p.respawnAt) {
        p.state = 'idle';
        p.hull = p.maxHull;
        p.pos = state.greatTemple[side].cell.slice();
        p.islandId = state.greatTemple[side].island.id;
        Events.emit('priestSucceeded', { side });
      }
      break;
    }
  }
}

function updateTransit(state, dt) {
  for (const h of state.haulers) if (h.state !== 'dead') updateHauler(state, h, dt);
  updatePriest(state, 'A', dt);
  updatePriest(state, 'P', dt);
}

// ============================================================
// STRUCTURES
// ============================================================

// ================================================================
// STRUCTURES (§14, §14.6, §14.7, §15) — guns, shields, temples, yards.
// Structures are network nodes with outgoing ports, not caps. Temples
// claim islands and crumble rival connections. Destruction of an
// inline structure always breaks its outward segment.
// ================================================================

function structureStats(side, type) {
  const S = CONFIG.Structures;
  const isA = side === 'A';
  switch (type) {
    case 'vane': {
      const d = isA ? S.VANE : S.DRUM;
      return { cost: d.COST, hp: d.HP, dps: d.DPS, radius: d.RADIUS, ports: S.PORTS_GUN, buildTime: CONFIG.BuildTimes.GUN };
    }
    case 'bolt': {
      const d = isA ? S.BOLT_DIR : S.LANCE;
      return { cost: d.COST, hp: d.HP, dps: d.DPS, range: d.RANGE, arc: d.ARC_DEG * Math.PI / 180, turn: d.TURN_DEG_S * Math.PI / 180, ports: S.PORTS_GUN, buildTime: CONFIG.BuildTimes.GUN };
    }
    case 'shield': {
      const d = isA ? S.AEGIS : S.BULWARK;
      return { cost: d.COST, hp: d.HP, intercept: d.INTERCEPT, arc: d.ARC_DEG * Math.PI / 180, ports: S.PORTS_SHIELD, buildTime: CONFIG.BuildTimes.SHIELD };
    }
    case 'temple':
      return { cost: S.TEMPLE.COST, hp: S.TEMPLE.HP, radius: S.TEMPLE.RADIUS, ports: 0, buildTime: CONFIG.BuildTimes.TEMPLE };
    case 'yard':
      return { cost: CONFIG.Yard.COST, hp: isA ? CONFIG.Yard.HP_AEOLUS : CONFIG.Yard.HP_POSEIDON, ports: 0, buildTime: CONFIG.BuildTimes.YARD };
    case 'mast': {
      // Poseidon's gauntlet piece (§33C.6): moored, AI-built, anti-air
      const d = CONFIG.Craft.SIPHON_MAST;
      return { cost: S.BOLT_DIR.COST, hp: d.HP, dps: d.DPS, range: d.RANGE, arc: Math.PI * 2, ports: 0, buildTime: CONFIG.BuildTimes.GUN };
    }
  }
}

function structureSupported(state, st) {
  if (st.hp <= 0) return false;
  if (st.site === 'plot') {
    const isl = state.map.islands[st.islandId];
    if (st.type === 'temple') {
      // a temple is its own anchor question: it needs the island connected home
      return islandSupported(state, isl, st.owner);
    }
    return islandConducts(state, isl, st.owner) && islandSupported(state, isl, st.owner);
  }
  return segmentSupportedAtCell(state, st.owner, st.cell[0], st.cell[1]);
}

// May `side` place `type` at this endpoint cell / plot? Returns a reason
// string when refused, or null when allowed.
function whyNotBuild(state, side, type, at) {
  const stats = structureStats(side, type);
  if (state.res[side].supply < stats.cost) return 'NOT ENOUGH SUPPLY';
  if (CONFIG.Influence.GATES_CONSTRUCTION && !state.influence[side].has(cellKey(at.cell[0], at.cell[1]))) return 'BEYOND YOUR INFLUENCE';
  if (at.site === 'endpoint') {
    if (type === 'temple' || type === 'yard') return 'ISLAND PLOTS ONLY';
    if (structureAt(state, at.cell[0], at.cell[1])) return 'OCCUPIED';
    if (!segmentSupportedAtCell(state, side, at.cell[0], at.cell[1])) return 'NO SUPPORTED ROUTE';
    const deg = nodeDegrees(state, side).get(cellKey(at.cell[0], at.cell[1])) || 0;
    if (deg !== 1) return 'ENDPOINTS ONLY';
  } else {
    const isl = state.map.islands[at.islandId];
    const plot = isl.plots[at.plotIdx];
    if (plot.structure) return 'PLOT OCCUPIED';
    if (type === 'temple') {
      if (isl.role.startsWith('greatTemple')) return 'HOLY GROUND';
      if (isl.temple && isl.temple.hp > 0) return 'A TEMPLE STANDS';
      if (CONFIG.Priest.REQUIRED_FOR_TEMPLE && !priestOnIsland(state, side, isl)) return 'THE PRIEST MUST BE PRESENT';
    } else {
      if (isl.owner !== side) return 'NOT YOUR ISLAND';
    }
  }
  return null;
}

function buildStructure(state, side, type, at, facing) {
  if (whyNotBuild(state, side, type, at)) return null;
  const stats = structureStats(side, type);
  state.res[side].supply -= stats.cost;
  const st = {
    id: eid(), owner: side, type,
    cell: at.cell.slice(),
    site: at.site,
    islandId: at.islandId !== undefined ? at.islandId : null,
    plotIdx: at.plotIdx !== undefined ? at.plotIdx : null,
    hp: stats.hp * CONFIG.BuildTimes.UNDER_CONSTRUCTION_HP_FRACTION,
    maxHp: stats.hp,
    buildProgress: stats.buildTime === 0 ? 1 : 0,
    buildTime: stats.buildTime,
    ports: stats.ports || 0,
    dps: stats.dps || 0,
    range: stats.range || stats.radius || 0,
    radius: stats.radius || 0,
    arc: stats.arc || 0,
    turn: stats.turn || 0,
    intercept: stats.intercept || 0,
    facing: facing !== undefined ? facing : defaultFacing(state, side, at.cell),
    lastHitAt: -99
  };
  state.structures.push(st);
  recalcSupport(state, side);   // a tower on a tip caps it (exposure changes)
  if (at.site === 'plot') {
    const isl = state.map.islands[at.islandId];
    isl.plots[at.plotIdx].structure = st;
    if (type === 'temple') {
      isl.temple = { owner: side, hp: st.hp, buildProgress: 0, cell: st.cell, structure: st };
      const p = state.priests[side];
      p.state = 'consecrating';
      p.consecrating = { islandId: isl.id, plotIdx: at.plotIdx };
      Events.emit('consecrationStarted', { side, island: isl });
    }
  }
  Events.emit('structureBuilt', { st });
  return st;
}

function defaultFacing(state, side, cell) {
  const foe = state.greatTemple[side === 'A' ? 'P' : 'A'];
  return Math.atan2(foe.cell[1] - cell[1], foe.cell[0] - cell[0]);
}

// build-progress + temple completion (the claim moment, §14.6)
function structuresTick(state, dt) {
  for (const st of state.structures) {
    if (st.hp <= 0 || st.buildProgress >= 1) continue;
    // temples only rise while the priest stands on the island (§14.8.1)
    if (st.type === 'temple') {
      const isl = state.map.islands[st.islandId];
      if (!priestOnIsland(state, st.owner, isl)) continue;
    }
    st.buildProgress = Math.min(1, st.buildProgress + dt / st.buildTime);
    if (st.buildProgress >= 1) {
      st.hp = Math.min(st.maxHp, st.hp + st.maxHp * (1 - CONFIG.BuildTimes.UNDER_CONSTRUCTION_HP_FRACTION));
      if (st.type === 'temple') completeTempleClaim(state, st);
      Events.emit('structureComplete', { st });
    }
  }
  // mirror temple hp onto island record
  for (const isl of state.map.islands) {
    if (isl.temple && isl.temple.structure) {
      isl.temple.hp = isl.temple.structure.hp;
      isl.temple.buildProgress = isl.temple.structure.buildProgress;
    }
  }
}

function completeTempleClaim(state, st) {
  const isl = state.map.islands[st.islandId];
  const side = st.owner;
  const foe = side === 'A' ? 'P' : 'A';
  isl.owner = side;
  isl.temple.buildProgress = 1;
  // crumble every opposing connection to this island, from the island inward
  for (const s of [...state.segments.values()]) {
    if (s.owner !== foe) continue;
    const touches = isl.cellSet.has(cellKey(s.a[0], s.a[1])) || isl.cellSet.has(cellKey(s.b[0], s.b[1]));
    if (touches) destroySegment(state, s, 'claim');
  }
  // rival structures on the island's plots fall with their footing
  for (const plot of isl.plots) {
    if (plot.structure && plot.structure.owner === foe) killStructure(state, plot.structure, 'claim');
  }
  recalcSupport(state, side);
  recalcSupport(state, foe);
  Events.emit('islandClaimed', { island: isl, side });
}

function damageStructure(state, st, amount, source) {
  if (st.hp <= 0) return;
  st.lastHitAt = state.time;
  st.hp -= amount;
  if (st.hp <= 0) {
    st.hp = 0;
    killStructure(state, st, source);
  }
}

function killStructure(state, st, cause) {
  st.hp = 0;
  if (st.site === 'plot' && st.islandId !== null) {
    const isl = state.map.islands[st.islandId];
    if (st.plotIdx !== null) isl.plots[st.plotIdx].structure = null;
    if (st.type === 'temple') {
      isl.temple = null;
      isl.owner = null;          // back to neutral, open to all (§14.6.5)
      Events.emit('templeFallen', { island: isl, side: st.owner });
      recalcSupport(state, 'A');
      recalcSupport(state, 'P');
    }
  } else if (st.site === 'endpoint') {
    // the explosion always destroys the outward adjacent segment (§33A.5)
    const touching = [...state.segments.values()].filter(s =>
      s.owner === st.owner &&
      ((s.a[0] === st.cell[0] && s.a[1] === st.cell[1]) || (s.b[0] === st.cell[0] && s.b[1] === st.cell[1])));
    if (touching.length) {
      const sup = state.supportedCells && state.supportedCells[st.owner];
      const outwardness = (s) => {
        // outward = endpoint farther from the supported side (falls back to temple distance)
        const other = (s.a[0] === st.cell[0] && s.a[1] === st.cell[1]) ? s.b : s.a;
        const gt = state.greatTemple[st.owner].cell;
        return Math.abs(other[0] - gt[0]) + Math.abs(other[1] - gt[1]);
      };
      touching.sort((a, b) => outwardness(b) - outwardness(a));
      const victim = touching[0];
      victim.hp -= CONFIG.Structures.DESTRUCTION_DAMAGE;
      Events.emit('structureExploded', { st });
      if (victim.hp <= 0) destroySegment(state, victim, 'explosion');
      else recalcSupport(state, st.owner);
    }
  }
  state.structures = state.structures.filter(x => x !== st);
  Events.emit('structureDestroyed', { st, cause });
}

// segments take damage too
function damageSegment(state, seg, amount) {
  seg.hp -= amount;
  if (seg.hp <= 0) destroySegment(state, seg, 'combat');
}

// ============================================================
// COMBAT
// ============================================================

// ================================================================
// COMBAT (§33A, §33B, §33C) — continuous, no rolls, no armour types.
// Both sides attack the other's road. Air segments are attackable only
// over open water; sea segments are sheltered within one cell of a
// coast. Shields physically absorb for what stands behind them.
// ================================================================

function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return Math.abs(d);
}

function overWaterPos(state, fx, fz) {
  return !state.map.land.has(cellKey(Math.round(fx), Math.round(fz)));
}

// ---- damage funnel: every hit passes through here ----
// target: {kind:'segment'|'structure'|'greatTemple'|'mover', ref, side, pos}
function applyDamage(state, target, amount, sourcePos) {
  if (state.wave.wrath) amount *= CONFIG.Wrath.DAMAGE_MULT;

  // Wind Wall (§33A.8): one endpoint, damage reduced 75%
  if (target.side === 'A' && state.time < state.powers.windwallUntil && state.powers.windwallCell) {
    const wc = state.powers.windwallCell;
    if (Math.hypot(target.pos[0] - wc[0], target.pos[1] - wc[1]) <= 1.2) {
      amount *= 1 - CONFIG.Powers.WIND_WALL.DAMAGE_REDUCTION;
    }
  }

  // shields intercept for structures and segments behind them (§14.3)
  if (sourcePos && (target.kind === 'segment' || target.kind === 'structure' || target.kind === 'greatTemple')) {
    for (const sh of state.structures) {
      if (sh.type !== 'shield' || sh.owner !== target.side || sh.hp <= 0 || sh.buildProgress < 1) continue;
      if (!structureSupported(state, sh)) continue;
      if (Math.hypot(target.pos[0] - sh.cell[0], target.pos[1] - sh.cell[1]) > CONFIG.Structures.SHIELD_COVER_RADIUS) continue;
      const toAttacker = Math.atan2(sourcePos[1] - sh.cell[1], sourcePos[0] - sh.cell[0]);
      if (angDiff(toAttacker, sh.facing) > sh.arc / 2) continue;
      const absorbed = amount * sh.intercept;
      amount -= absorbed;
      damageStructure(state, sh, absorbed, 'intercept');
      break;   // one shield per hit
    }
  }

  switch (target.kind) {
    case 'segment': damageSegment(state, target.ref, amount); break;
    case 'structure': damageStructure(state, target.ref, amount, 'combat'); break;
    case 'greatTemple': {
      const gt = state.greatTemple[target.side];
      gt.hp -= amount;
      if (target.side === 'A') state.gtaLastHit = state.time;
      Events.emit('greatTempleHit', { side: target.side });
      break;
    }
    case 'mover': {
      const m = target.ref;
      let dmg = amount;
      if (m.kind === 'hauler' && state.hydrogen[m.owner]) dmg *= CONFIG.Airship.HYDROGEN_DAMAGE_MULT;
      m.hull -= dmg;
      m.lastHitAt = state.time;
      if (m.hull <= 0) {
        if (m.kind === 'priest') {
          m.state = 'dead';
          m.respawnAt = state.time + CONFIG.Priest.SUCCESSION_SECONDS;
          Events.emit('priestDead', { side: m.owner });
        } else if (m.kind === 'hauler') {
          m.state = 'dead';
          Events.emit('convoyLost', { ent: m });
        } else {
          m.dead = true;
          Events.emit('craftDestroyed', { craft: m });
        }
      }
      break;
    }
  }
}

// ---- target enumeration ----
function enemyMovers(state, side) {
  const foe = side === 'A' ? 'P' : 'A';
  const out = [];
  for (const h of state.haulers) {
    if (h.owner === foe && h.state !== 'dead' && h.state !== 'idle') out.push(h);
  }
  const p = state.priests[foe];
  if (p && (p.state === 'transit' || p.state === 'adrift')) out.push(p);
  if (side === 'A') for (const c of state.craft) if (!c.dead) out.push(c);
  return out;
}

function enemySegments(state, side) {
  const foe = side === 'A' ? 'P' : 'A';
  const out = [];
  for (const s of state.segments.values()) {
    if (s.owner !== foe) continue;
    if (!s.rawEnd) continue;                          // paths are attackable only at raw open ends
    if (foe === 'A' && !s.overWater) continue;       // island crossings untouchable (§33B.1)
    if (foe === 'P' && s.sheltered) continue;         // lee shore (§33B.2a)
    out.push(s);
  }
  return out;
}

function enemyStructureTargets(state, side) {
  const foe = side === 'A' ? 'P' : 'A';
  const out = [];
  for (const st of state.structures) {
    if (st.owner === foe && st.hp > 0) out.push({ kind: 'structure', ref: st, side: foe, pos: st.cell });
  }
  const gt = state.greatTemple[foe];
  if (gt.hp > 0) out.push({ kind: 'greatTemple', ref: gt, side: foe, pos: gt.cell });
  return out;
}

function segMid(s) { return [(s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2]; }

// visibility gate: the AI obeys fog too (§14B.5); both sides may only
// target what they can currently see
function canSee(state, side, pos) {
  return state.vision[side].has(cellKey(Math.round(pos[0]), Math.round(pos[1])));
}

// ---- gun resolution ----
function gunTick(state, st, dt) {
  if (st.hp <= 0 || st.buildProgress < 1 || (st.type !== 'vane' && st.type !== 'bolt' && st.type !== 'mast')) return;
  if (!structureSupported(state, st)) return;   // nothing fires without support (§14.4.3)
  const side = st.owner;
  let dps = st.dps, range = st.type === 'vane' ? st.radius : st.range;

  // Fog Bank halves player gun range and damage in region (§33A.8)
  if (side === 'A' && state.powers.fog && state.time < state.powers.fog.until) {
    const f = state.powers.fog;
    if (Math.hypot(st.cell[0] - f.cell[0], st.cell[1] - f.cell[1]) <= CONFIG.Powers.FOG_BANK.RADIUS) {
      dps *= CONFIG.Powers.FOG_BANK.BOLT_PENALTY;
      range *= CONFIG.Powers.FOG_BANK.BOLT_PENALTY;
    }
  }

  const inRange = (pos) => Math.hypot(pos[0] - st.cell[0], pos[1] - st.cell[1]) <= range;

  // masts and siphon-type sources cannot hit airships over land (§33C.6)
  const moverTargets = enemyMovers(state, side).filter(m => {
    if (!inRange(m.pos) || !canSee(state, side, m.pos)) return false;
    if (side === 'P' && !overWaterPos(state, m.pos[0], m.pos[1])) return false;
    return true;
  }).map(m => ({ kind: 'mover', ref: m, side: m.owner, pos: m.pos }));

  const structTargets = enemyStructureTargets(state, side).filter(t => inRange(t.pos) && canSee(state, side, t.pos));
  const segTargets = enemySegments(state, side)
    .filter(s => inRange(segMid(s)) && canSee(state, side, segMid(s)))
    .map(s => ({ kind: 'segment', ref: s, side: s.owner, pos: segMid(s) }));

  if (st.type === 'vane') {
    // radial: hits every valid target in radius
    const all = [...moverTargets, ...structTargets, ...segTargets];
    for (const t of all) {
      applyDamage(state, t, dps * dt, st.cell);
    }
    if (all.length && (!st.nextFxAt || state.time >= st.nextFxAt)) {
      st.nextFxAt = state.time + 0.3;
      Events.emit('gunFired', { side, from: st.cell, to: all[0].pos, targetSide: all[0].side, kind: all[0].kind });
    }
    return;
  }

  // directional: prefer craft > structures > segments, nearest first (§33A.1)
  const pick = moverTargets.concat(structTargets, segTargets)
    .sort((a, b) =>
      Math.hypot(a.pos[0] - st.cell[0], a.pos[1] - st.cell[1]) -
      Math.hypot(b.pos[0] - st.cell[0], b.pos[1] - st.cell[1]));
  // stable class priority
  const target = moverTargets.length ? pick.find(t => t.kind === 'mover')
    : structTargets.length ? pick.find(t => t.kind === 'structure' || t.kind === 'greatTemple')
    : pick[0];
  if (!target) return;

  // rotate slowly toward the target; fire only inside the arc
  const want = Math.atan2(target.pos[1] - st.cell[1], target.pos[0] - st.cell[0]);
  const d = want - st.facing;
  const wrapped = Math.atan2(Math.sin(d), Math.cos(d));
  const maxTurn = (st.turn || 1) * dt;
  st.facing += clamp(wrapped, -maxTurn, maxTurn);
  if (angDiff(want, st.facing) <= (st.arc || Math.PI * 2) / 2) {
    applyDamage(state, target, dps * dt, st.cell);
    st.firingAt = target.pos.slice();
    st.lastFired = state.time;
    if (!st.nextFxAt || state.time >= st.nextFxAt) {
      st.nextFxAt = state.time + 0.25;
      Events.emit('gunFired', { side, from: st.cell, to: target.pos, targetSide: target.side, kind: target.kind });
    }
  }
}

// ---- craft attacks (transports, siphons, heavies) are resolved in the
// wave system where their movement lives; combatTick runs the guns ----
function combatTick(state, dt) {
  for (const st of state.structures) gunTick(state, st, dt);
}

// ============================================================
// WAVES
// ============================================================

// ================================================================
// WAVES (§16, §16A, §17, §18) — nine authored, telegraphed assaults.
// Waves launch from Poseidon's temple nearest the player's forward
// holdings; strength scales with his temple count, floored so he
// always attacks. Wave 5 is the scripted strike on the most forward
// player structure. Wave 8 is the Age of Wrath.
// ================================================================

function waveInterval(index) {
  const W = CONFIG.Waves;
  if (index + 1 >= W.LATE_FROM_WAVE) return W.INTERVAL_LATE;
  if (index + 1 >= W.MID_FROM_WAVE) return W.INTERVAL_MID;
  return W.INTERVAL_EARLY;
}

// Poseidon's standing complete island temples
function poseidonTempleCount(state) {
  let n = 0;
  for (const isl of state.map.islands) {
    if (isl.temple && isl.temple.owner === 'P' && isl.temple.hp > 0 && isl.temple.buildProgress >= 1) n++;
  }
  return n;
}

function waveStrength(state) {
  const W = CONFIG.Waves;
  return clamp(W.STRENGTH_BASE + W.STRENGTH_PER_TEMPLE * poseidonTempleCount(state), W.STRENGTH_MIN, W.STRENGTH_MAX);
}

// the player's most forward holding (largest distance from their temple)
function forwardHolding(state) {
  const gt = state.greatTemple.A.cell;
  let best = gt, bd = -1;
  for (const st of state.structures) {
    if (st.owner !== 'A' || st.hp <= 0) continue;
    const d = Math.abs(st.cell[0] - gt[0]) + Math.abs(st.cell[1] - gt[1]);
    if (d > bd) { bd = d; best = st.cell; }
  }
  for (const s of state.segments.values()) {
    if (s.owner !== 'A') continue;
    const d = Math.abs(s.a[0] - gt[0]) + Math.abs(s.a[1] - gt[1]);
    if (d > bd) { bd = d; best = s.a; }
  }
  return best;
}

// wave origin: his conducting temple nearest the player's forward holdings,
// else his Great Temple (§16A.3)
function waveOrigin(state) {
  const fwd = forwardHolding(state);
  let best = null, bd = Infinity;
  for (const isl of state.map.islands) {
    if (isl.temple && isl.temple.owner === 'P' && isl.temple.hp > 0 && isl.temple.buildProgress >= 1) {
      const d = dist2d(isl.temple.cell[0], isl.temple.cell[1], fwd[0], fwd[1]);
      if (d < bd) { bd = d; best = { cell: isl.temple.cell, island: isl }; }
    }
  }
  if (!best) best = { cell: state.greatTemple.P.cell, island: state.gtP };
  return best;
}

// nearest water cell to a cell (spawn point / approach goal)
function nearestWater(state, cell, avoid) {
  let frontier = [[cell[0], cell[1]]];
  const seen = new Set([cellKey(cell[0], cell[1])]);
  while (frontier.length) {
    const next = [];
    for (const [x, z] of frontier) {
      if (!state.map.land.has(cellKey(x, z))) return [x, z];
      for (const [dx, dz] of DIRS4) {
        const k = cellKey(x + dx, z + dz);
        if (!inBounds(x + dx, z + dz) || seen.has(k)) continue;
        seen.add(k);
        next.push([x + dx, z + dz]);
      }
    }
    frontier = next;
  }
  return cell;
}

function waterPath(state, from, to) {
  const start = nearestWater(state, [Math.round(from[0]), Math.round(from[1])]);
  const goal = nearestWater(state, [Math.round(to[0]), Math.round(to[1])]);
  return bfsPath([start], new Set([cellKey(goal[0], goal[1])]), (x, z) => !state.map.land.has(cellKey(x, z)));
}

function spawnCraft(state, kind, origin, script) {
  const def = kind === 'transport' ? CONFIG.Craft.TRANSPORT : kind === 'siphon' ? CONFIG.Craft.SIPHON : CONFIG.Craft.HEAVY;
  const c = {
    id: eid(), kind, owner: 'P',
    pos: nearestWater(state, origin.cell).map(v => v + 0),
    hull: def.HP, maxHull: def.HP,
    dps: def.DPS, range: Math.max(def.RANGE, 1.1), speed: def.SPEED,
    path: null, legIndex: 0, legT: 0,
    target: null, retargetAt: 0,
    script: script || null,   // wave-5 scripted strike carries a fixed target
    dead: false
  };
  state.craft.push(c);
  return c;
}

function launchWave(state) {
  const W = CONFIG.Waves;
  const idx = state.wave.index;               // 0-based
  const comp = W.COMPOSITION[idx];
  const mult = waveStrength(state);
  const origin = state.wave.origin || waveOrigin(state);
  const count = comp.map(n => Math.max(n > 0 ? 1 : 0, Math.round(n * mult)));

  // wave 5's heavies are scripted onto the most forward player structure (§18)
  let scriptTarget = null;
  if (idx + 1 === 5) {
    let bd = -1;
    const gt = state.greatTemple.A.cell;
    for (const st of state.structures) {
      if (st.owner !== 'A' || st.hp <= 0 || st.site !== 'endpoint') continue;
      const d = Math.abs(st.cell[0] - gt[0]) + Math.abs(st.cell[1] - gt[1]);
      if (d > bd) { bd = d; scriptTarget = st; }
    }
  }

  for (let i = 0; i < count[0]; i++) spawnCraft(state, 'transport', origin);
  for (let i = 0; i < count[1]; i++) spawnCraft(state, 'siphon', origin);
  for (let i = 0; i < count[2]; i++) spawnCraft(state, 'heavy', origin, scriptTarget ? { structureId: scriptTarget.id } : null);

  // divine escalation (§19.2)
  if (idx + 1 >= 6) castTidalSurge(state);
  if (idx + 1 >= 7) castFogBank(state);
  if (idx + 1 === CONFIG.Wrath.WAVE) {
    state.wave.wrath = true;
    Events.emit('ageOfWrath', {});
  }
  Events.emit('waveLaunched', { index: idx });
}

function castTidalSurge(state) {
  // a supernatural wave centred on the player's most forward over-water
  // structure; sheltered ground is untouched (§33B.1)
  let center = null, bd = -1;
  const gt = state.greatTemple.A.cell;
  for (const st of state.structures) {
    if (st.owner !== 'A' || st.hp <= 0 || st.site !== 'endpoint') continue;
    if (!overWaterPos(state, st.cell[0], st.cell[1])) continue;
    const d = Math.abs(st.cell[0] - gt[0]) + Math.abs(st.cell[1] - gt[1]);
    if (d > bd) { bd = d; center = st.cell; }
  }
  if (!center) return;
  const P = CONFIG.Powers.TIDAL_SURGE;
  for (const st of state.structures) {
    if (st.owner !== 'A' || st.site !== 'endpoint') continue;
    if (!overWaterPos(state, st.cell[0], st.cell[1])) continue;
    if (dist2d(st.cell[0], st.cell[1], center[0], center[1]) <= P.RADIUS) {
      applyDamage(state, { kind: 'structure', ref: st, side: 'A', pos: st.cell }, P.DAMAGE, null);
    }
  }
  for (const s of [...state.segments.values()]) {
    if (s.owner !== 'A' || !s.overWater) continue;
    const m = segMid(s);
    if (dist2d(m[0], m[1], center[0], center[1]) <= P.RADIUS) {
      applyDamage(state, { kind: 'segment', ref: s, side: 'A', pos: m }, P.DAMAGE, null);
    }
  }
  Events.emit('tidalSurge', { center });
}

function castFogBank(state) {
  // dropped on the player's densest cluster of guns
  let best = null, bs = 0;
  for (const st of state.structures) {
    if (st.owner !== 'A' || (st.type !== 'bolt' && st.type !== 'vane') || st.hp <= 0) continue;
    let n = 0;
    for (const o of state.structures) {
      if (o.owner === 'A' && (o.type === 'bolt' || o.type === 'vane') && o.hp > 0 &&
          dist2d(st.cell[0], st.cell[1], o.cell[0], o.cell[1]) <= CONFIG.Powers.FOG_BANK.RADIUS) n++;
    }
    if (n > bs) { bs = n; best = st.cell; }
  }
  if (!best) return;
  state.powers.fog = { cell: best.slice(), until: state.time + CONFIG.Powers.FOG_BANK.DURATION };
  Events.emit('fogBank', { center: best });
}

// ---- craft behaviour ----
function craftPickTarget(state, c) {
  const inR = (pos, r) => dist2d(pos[0], pos[1], c.pos[0], c.pos[1]) <= r;
  if (c.script) {
    const st = state.structures.find(s => s.id === c.script.structureId && s.hp > 0);
    if (st) return { kind: 'structure', ref: st, side: 'A', pos: st.cell };
    c.script = null;
  }
  const structs = enemyStructureTargets(state, 'P');   // player structures + GT
  if (c.kind === 'transport' || c.kind === 'heavy') {
    // island structures and temples first, else the Great Temple
    const pref = structs.filter(t => t.kind === 'greatTemple' || t.ref.site === 'plot' || c.kind === 'heavy');
    const pool = pref.length ? pref : structs;
    let best = null, bd = Infinity;
    for (const t of pool) {
      const d = dist2d(t.pos[0], t.pos[1], c.pos[0], c.pos[1]);
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }
  // siphon: raw air-route ends over open water, then over-water structures
  let best = null, bd = Infinity;
  for (const s of state.segments.values()) {
    if (s.owner !== 'A' || !s.overWater || !s.rawEnd) continue;
    const m = segMid(s);
    const d = dist2d(m[0], m[1], c.pos[0], c.pos[1]);
    if (d < bd) { bd = d; best = { kind: 'segment', ref: s, side: 'A', pos: m }; }
  }
  if (!best) {
    for (const t of structs) {
      if (t.kind === 'structure' && t.ref.site === 'endpoint' && overWaterPos(state, t.pos[0], t.pos[1])) {
        const d = dist2d(t.pos[0], t.pos[1], c.pos[0], c.pos[1]);
        if (d < bd) { bd = d; best = t; }
      }
    }
  }
  return best;
}

function updateCraft(state, c, dt) {
  if (c.dead) return;
  if (!c.target || state.time >= c.retargetAt ||
      (c.target.kind === 'structure' && c.target.ref.hp <= 0) ||
      (c.target.kind === 'segment' && !state.segments.has('A:' + c.target.ref.key))) {
    c.target = craftPickTarget(state, c);
    c.retargetAt = state.time + 3;
    c.path = null;
  }
  if (!c.target) return;
  const d = dist2d(c.target.pos[0], c.target.pos[1], c.pos[0], c.pos[1]);
  if (d <= c.range) {
    // fire (vision is implicit: it is adjacent)
    applyDamage(state, c.target, c.dps * dt, c.pos);
    if (!c.nextFxAt || state.time >= c.nextFxAt) {
      c.nextFxAt = state.time + 0.35;
      Events.emit('craftFired', { from: c.pos, to: c.target.pos, targetSide: c.target.side, kind: c.target.kind });
    }
    return;
  }
  if (!c.path) {
    c.path = waterPath(state, c.pos, c.target.pos);
    c.legIndex = 0; c.legT = 0;
    if (!c.path || c.path.length < 2) { c.path = null; return; }
  }
  // advance along water path with slight sea wind effect
  const a = c.path[c.legIndex], b = c.path[Math.min(c.legIndex + 1, c.path.length - 1)];
  const dx = b[0] - a[0], dz = b[1] - a[1];
  const len = Math.hypot(dx, dz) || 1;
  const mult = state.wind.multiplier(c.pos[0], c.pos[1], dx / len, dz / len, false);
  c.legT += c.speed * mult * dt;
  while (c.legT >= 1 && c.legIndex < c.path.length - 2) { c.legT -= 1; c.legIndex++; }
  const na = c.path[c.legIndex], nb = c.path[Math.min(c.legIndex + 1, c.path.length - 1)];
  c.pos = [lerp(na[0], nb[0], Math.min(c.legT, 1)), lerp(na[1], nb[1], Math.min(c.legT, 1))];
}

// ---- the schedule ----
function wavesTick(state, dt) {
  const W = CONFIG.Waves;
  const w = state.wave;
  if (w.index < W.COUNT) {
    if (!w.telegraphed && state.time >= w.nextAt - W.TELEGRAPH) {
      w.telegraphed = true;
      w.origin = waveOrigin(state);
      Events.emit('waveTelegraph', { index: w.index, origin: w.origin });
    }
    if (state.time >= w.nextAt) {
      launchWave(state);
      w.index++;
      w.telegraphed = false;
      w.origin = null;
      w.nextAt += waveInterval(w.index);
    }
  }
  for (const c of state.craft) updateCraft(state, c, dt);
  state.craft = state.craft.filter(c => !c.dead);
}

// ============================================================
// AI
// ============================================================

// ================================================================
// POSEIDON AI (§29) — not a general solver. He grows lanes toward
// scored islands one visible piece at a time, founds temples with his
// priest, raises masts along contested straits, and reroutes (with a
// cooldown) when the player cuts him. Waves are authored separately.
// ================================================================

function initAI(state) {
  state.ai = {
    plan: null,                // list of cells toward the objective
    objectiveIsland: null,
    placeAt: 0,
    decideAt: 0,
    mastAt: CONFIG.AI.MAST_INTERVAL,
    rerouteBlockedUntil: 0,
    avoidCells: new Map(),     // cellKey -> until (recently cut ground)
    badObjectives: new Map()   // islandId -> until (planning there failed)
  };
  // his Great Temple is defended by two authored structures (§13A.4)
  const isl = state.gtP;
  for (let i = 0; i < Math.min(2, isl.plots.length); i++) {
    const type = i === 0 ? 'bolt' : 'vane';
    const stats = structureStats('P', type);
    const plot = isl.plots[i];
    const st = {
      id: eid(), owner: 'P', type, cell: [plot.x, plot.z], site: 'plot',
      islandId: isl.id, plotIdx: i,
      hp: stats.hp, maxHp: stats.hp, buildProgress: 1, buildTime: 0,
      ports: 0, dps: stats.dps, range: stats.range || stats.radius || 0,
      radius: stats.radius || 0, arc: stats.arc || Math.PI * 2, turn: stats.turn || 2,
      intercept: 0, facing: defaultFacing(state, 'P', [plot.x, plot.z]), lastHitAt: -99
    };
    state.structures.push(st);
    plot.structure = st;
  }
  Events.on('segmentDestroyed', ({ seg, cause }) => {
    if (seg.owner !== 'P' || cause === 'collapse') return;
    // a successful player cut: pause rerouting, avoid the cut ground
    state.ai.rerouteBlockedUntil = state.time + CONFIG.Waves.AI_REROUTE_COOLDOWN;
    state.ai.plan = null;
    state.ai.avoidCells.set(cellKey(seg.a[0], seg.a[1]), state.time + 40);
    state.ai.avoidCells.set(cellKey(seg.b[0], seg.b[1]), state.time + 40);
  });
}

// score islands worth taking (§29): influence gain, reserves, proximity
function aiScoreIsland(state, isl) {
  if (isl.role.startsWith('greatTemple')) return -1;
  if (isl.temple && isl.temple.hp > 0) return -1;             // taken (his or claimed rival ground)
  // he cannot build toward ground he holds no influence over — hard gate,
  // or distant player-side islands hypnotise him into replanning forever
  if (!state.influence.P.has(cellKey(Math.round(isl.center[0]), Math.round(isl.center[1])))) return 0.2;
  const bad = state.ai && state.ai.badObjectives;
  if (bad && bad.has(isl.id) && state.time < bad.get(isl.id)) return 0.1;
  let score = 0;
  // uncontested ground his temple would newly cover
  let overlap = 0;
  for (let dz = -CONFIG.Influence.TEMPLE_RADIUS; dz <= CONFIG.Influence.TEMPLE_RADIUS; dz++) {
    for (let dx = -CONFIG.Influence.TEMPLE_RADIUS; dx <= CONFIG.Influence.TEMPLE_RADIUS; dx++) {
      const x = Math.round(isl.center[0]) + dx, z = Math.round(isl.center[1]) + dz;
      if (!inBounds(x, z)) continue;
      if (dist2d(x, z, isl.center[0], isl.center[1]) > CONFIG.Influence.TEMPLE_RADIUS) continue;
      if (state.influence.A.has(cellKey(x, z))) overlap++;
    }
  }
  score += overlap * (CONFIG.AI.TEMPLE_PRIORITY_OVERLAP ? 0.8 : 0.2);
  score += Math.min(isl.reserve / 20, 8);
  const d = dist2d(isl.center[0], isl.center[1], state.greatTemple.P.cell[0], state.greatTemple.P.cell[1]);
  score += Math.max(0, 14 - d) * 0.5;
  return score;
}

// plan a sheltered-preferring water path from his network to the island
function aiPlanPath(state, isl) {
  // start cells: sockets of his network
  const sockets = getSockets(state, 'P');
  if (!sockets.length) return null;
  const dl = state.ai.distToLand || (state.ai.distToLand = distToLandGrid(state.map));
  const avoid = state.ai.avoidCells;
  const target = new Set(isl.cells.map(([x, z]) => cellKey(x, z)));
  // Dijkstra-lite with weights: sheltered water 1.0, open water 1.5 (§33B.2a),
  // island cells passable at 1.0 (a lane may land on a coast)
  const startKeys = sockets.map(s => cellKey(s.cell[0], s.cell[1]));
  const dist = new Map(startKeys.map(k => [k, 0]));
  const prev = new Map(startKeys.map(k => [k, null]));
  const queue = [...startKeys];
  while (queue.length) {
    queue.sort((a, b) => dist.get(a) - dist.get(b));
    const k = queue.shift();
    if (target.has(k)) {
      const path = [];
      let cur = k;
      while (cur !== null) { path.push(keyCell(cur)); cur = prev.get(cur); }
      return path.reverse();
    }
    const [x, z] = keyCell(k);
    for (const [dx, dz] of DIRS4) {
      const nx = x + dx, nz = z + dz, nk = cellKey(nx, nz);
      if (!inBounds(nx, nz)) continue;
      if (!state.influence.P.has(nk)) continue;                       // influence gates him too
      if (avoid.has(nk) && state.time < avoid.get(nk)) continue;
      const isl2 = islandAt(state, nx, nz);
      if (isl2 && islandClosedTo(state, isl2, 'P')) continue;
      // never plan an edge that retraces an existing lane (it could not be placed)
      if (state.segments.has('P:' + segKey(x, z, nx, nz))) continue;
      const water = !state.map.land.has(nk);
      const w = water ? (dl[nz][nx] <= CONFIG.Segments.LEE_SHORE_CELLS ? 1.0 : 1.5) : 1.0;
      const nd = dist.get(k) + w;
      if (nd < (dist.get(nk) ?? Infinity)) {
        dist.set(nk, nd);
        prev.set(nk, k);
        if (!queue.includes(nk)) queue.push(nk);
      }
    }
  }
  return null;
}

// place the next SHORT piece along the plan
function aiPlaceNext(state) {
  const ai = state.ai;
  if (!ai.plan || ai.plan.length < 3) { ai.plan = null; return false; }
  const [p0, p1, p2] = ai.plan;
  const segs = [[p0, p1], [p1, p2]];
  if (!placementLegal(state, 'P', segs)) { ai.plan = null; return false; }
  // p0 must still be a socket of his network
  const sockets = getSockets(state, 'P');
  if (!sockets.some(s => s.cell[0] === p0[0] && s.cell[1] === p0[1])) { ai.plan = null; return false; }
  if (!placePiece(state, 'P', 'SHORT', segs)) return false;   // cannot afford
  ai.plan = ai.plan.slice(2);
  if (ai.plan.length < 3) ai.plan = null;
  return true;
}

function aiTick(state, dt) {
  const ai = state.ai;
  if (state.over) return;
  if (state.time < ai.decideAt) return;
  ai.decideAt = state.time + CONFIG.AI.DECISION_INTERVAL;

  const res = state.res.P;

  // 1. priest: found temples on reached neutral islands
  const p = state.priests.P;
  if (p && p.state === 'idle') {
    const isl = p.islandId !== null ? state.map.islands[p.islandId] : null;
    if (isl && !isl.role.startsWith('greatTemple') && (!isl.temple || isl.temple.hp <= 0) &&
        res.supply >= CONFIG.Structures.TEMPLE.COST) {
      const plotIdx = isl.plots.findIndex(pl => !pl.structure);
      if (plotIdx >= 0) {
        buildStructure(state, 'P', 'temple', { site: 'plot', islandId: isl.id, plotIdx, cell: [isl.plots[plotIdx].x, isl.plots[plotIdx].z] });
      }
    } else {
      // sail to the best reachable neutral island
      let best = null, bs = 0;
      for (const cand of state.map.islands) {
        if (cand.role.startsWith('greatTemple')) continue;
        if (cand.temple && cand.temple.hp > 0) continue;
        if (!findNetPath(state, 'P', [Math.round(p.pos[0]), Math.round(p.pos[1])], cand.cells)) continue;
        const s = aiScoreIsland(state, cand) + 5;
        if (s > bs) { bs = s; best = cand; }
      }
      if (best && (p.islandId === null || best.id !== p.islandId)) sendPriest(state, 'P', best);
    }
  }

  // 2. lanes toward the best objective
  if (state.time >= ai.placeAt && state.time >= ai.rerouteBlockedUntil) {
    if (!ai.plan) {
      let best = null, bs = 0.5;
      for (const isl of state.map.islands) {
        const s = aiScoreIsland(state, isl);
        if (s > bs) {
          // already connected? then no lane needed
          const touched = [...state.segments.values()].some(seg => seg.owner === 'P' &&
            (isl.cellSet.has(cellKey(seg.a[0], seg.a[1])) || isl.cellSet.has(cellKey(seg.b[0], seg.b[1]))));
          if (touched) continue;
          bs = s; best = isl;
        }
      }
      if (best) {
        ai.objectiveIsland = best.id;
        ai.plan = aiPlanPath(state, best);
        if (!ai.plan || ai.plan.length < 3) {
          // unreachable for now: blacklist it so he tries something else
          ai.badObjectives.set(best.id, state.time + 30);
          ai.plan = null;
        }
      }
    }
    if (ai.plan && res.supply >= pieceCost('SHORT')) {
      if (aiPlaceNext(state)) ai.placeAt = state.time + CONFIG.AI.PLACE_INTERVAL;
    }
  }

  // 3. economy: yards and haulers
  const cap = fleetCap(state, 'P');
  const fleet = state.haulers.filter(h => h.owner === 'P' && h.state !== 'dead').length;
  if (fleet < cap && res.supply >= CONFIG.Hauler.COST + 6) buyHauler(state, 'P');
  if (fleet >= cap && res.supply >= CONFIG.Yard.COST + CONFIG.Hauler.COST + 8) {
    // a yard on a safe owned island plot
    for (const isl of state.map.islands) {
      if (isl.owner !== 'P' || isl.role.startsWith('greatTemple')) continue;
      const plotIdx = isl.plots.findIndex(pl => !pl.structure);
      if (plotIdx >= 0 && islandSupported(state, isl, 'P')) {
        buildStructure(state, 'P', 'yard', { site: 'plot', islandId: isl.id, plotIdx, cell: [isl.plots[plotIdx].x, isl.plots[plotIdx].z] });
        break;
      }
    }
  }

  // 4. masts along contested straits (§33C.6), between waves
  if (state.time >= ai.mastAt && res.supply >= structureStats('P', 'mast').cost) {
    ai.mastAt = state.time + CONFIG.AI.MAST_INTERVAL;
    // his supported endpoint nearest a player air segment over water
    const airSegs = [...state.segments.values()].filter(s => s.owner === 'A' && s.overWater);
    if (airSegs.length) {
      const sockets = getSockets(state, 'P').filter(s => s.kind === 'end');
      let best = null, bd = Infinity;
      for (const sock of sockets) {
        if (structureAt(state, sock.cell[0], sock.cell[1])) continue;
        for (const seg of airSegs) {
          const m = segMid(seg);
          const d = dist2d(sock.cell[0], sock.cell[1], m[0], m[1]);
          if (d < bd) { bd = d; best = sock; }
        }
      }
      if (best && bd <= CONFIG.Craft.SIPHON_MAST.RANGE + 2) {
        buildStructure(state, 'P', 'mast', { site: 'endpoint', cell: best.cell });
      }
    }
  }
}

// ================================================================
// FOG AND VISION (§14B) — terrain is never fogged; enemy craft need
// live vision; enemy structures and segments, once seen, stay drawn
// at their last known state. Both sides obey the same rules.
// ================================================================

let fogAccum = 0;

function computeVision(state, side) {
  const vis = new Set();
  const add = (cx, cz, r) => {
    for (let z = Math.max(0, Math.floor(cz - r)); z <= Math.min(CONFIG.Grid.HEIGHT - 1, Math.ceil(cz + r)); z++) {
      for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(CONFIG.Grid.WIDTH - 1, Math.ceil(cx + r)); x++) {
        if (dist2d(x, z, cx, cz) <= r) vis.add(cellKey(x, z));
      }
    }
  };
  const V = CONFIG.Vision;
  const gt = state.greatTemple[side];
  if (gt.hp > 0) add(gt.cell[0], gt.cell[1], V.TEMPLE);
  for (const st of state.structures) {
    if (st.owner !== side || st.hp <= 0) continue;
    add(st.cell[0], st.cell[1], st.type === 'temple' ? V.TEMPLE : V.STRUCTURE);
  }
  for (const s of state.segments.values()) {
    if (s.owner !== side) continue;
    const m = segMid(s);
    add(m[0], m[1], V.SEGMENT);
  }
  for (const h of state.haulers) {
    if (h.owner === side && h.state !== 'dead') add(h.pos[0], h.pos[1], V.HAULER);
  }
  const p = state.priests[side];
  if (p && p.state !== 'dead') add(p.pos[0], p.pos[1], V.HAULER);
  return vis;
}

function fogTick(state, dt) {
  fogAccum += dt;
  if (fogAccum < 0.4 && state.vision.A.size) return;   // throttled
  fogAccum = 0;
  for (const side of ['A', 'P']) {
    state.vision[side] = computeVision(state, side);
    // exploration: ground once seen stays lifted (the shroud is one-way)
    if (side === 'A') {
      if (!state.explored) state.explored = new Set();
      for (const k of state.vision.A) state.explored.add(k);
    }
    // memory: enemy structures and segments currently in sight are remembered
    if (CONFIG.Vision.REMEMBER_STRUCTURES) {
      const foe = side === 'A' ? 'P' : 'A';
      const mem = state.memory[side];
      for (const st of state.structures) {
        if (st.owner === foe && st.hp > 0 && state.vision[side].has(cellKey(st.cell[0], st.cell[1]))) {
          mem.set('st:' + st.id, state.time);
        }
      }
      for (const s of state.segments.values()) {
        if (s.owner !== foe) continue;
        const m = segMid(s);
        if (state.vision[side].has(cellKey(Math.round(m[0]), Math.round(m[1])))) mem.set('seg:' + s.key, state.time);
      }
    }
  }
}

// ================================================================
// DIVINE POWERS — Aeolus' two petitions (§19.1, §33A.8).
// Tailwind speeds the fleet for a spell; Wind Wall shelters one
// exposed endpoint. Poseidon's powers live in the wave system.
// ================================================================

function castTailwind(state) {
  const P = CONFIG.Powers.TAILWIND;
  if (state.res.A.favor < P.FAVOR) return false;
  if (state.time < state.powers.tailwindUntil) return false;
  state.res.A.favor -= P.FAVOR;
  state.powers.tailwindUntil = state.time + P.DURATION;
  Events.emit('tailwind', {});
  return true;
}

// armed by the button, then aimed with a tap on one of your endpoint
// structures or route ends
function castWindWall(state, cell) {
  const P = CONFIG.Powers.WIND_WALL;
  if (state.res.A.favor < P.FAVOR) return false;
  state.res.A.favor -= P.FAVOR;
  state.powers.windwallUntil = state.time + P.DURATION;
  state.powers.windwallCell = cell.slice();
  Events.emit('windwall', { cell });
  return true;
}

        setTimeout(() => document.getElementById('skipbtn').classList.add('hidden'), 6000);

// ================================================================
// AUDIO (§32) — everything synthesised at runtime with WebAudio.
// Zero bytes of assets, zero requests, fully parameterised feedback.
// ================================================================

const Audio2 = { ctx: null, master: null, windGain: null, ready: false };

function audioInit() {
  if (Audio2.ready) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    Audio2.ctx = ctx;
    Audio2.master = ctx.createGain();
    Audio2.master.gain.value = 0.5;
    Audio2.master.connect(ctx.destination);

    // ambient wind: filtered noise, slowly breathing
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let v = 0;
    for (let i = 0; i < len; i++) {
      v = v * 0.98 + (Math.random() * 2 - 1) * 0.02;   // brownish noise
      data[i] = v * 8;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const filt = ctx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 420;
    filt.Q.value = 0.6;
    Audio2.windGain = ctx.createGain();
    Audio2.windGain.gain.value = 0.12;
    src.connect(filt).connect(Audio2.windGain).connect(Audio2.master);
    src.start();

    // wind LFO breathing
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.07;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.05;
    lfo.connect(lfoGain).connect(Audio2.windGain.gain);
    lfo.start();

    Audio2.ready = true;
  } catch (e) { /* audio stays silent if the context is refused */ }
}

function tone(freq, dur, type, gain, when, slideTo) {
  if (!Audio2.ready) return;
  const ctx = Audio2.ctx;
  const t0 = ctx.currentTime + (when || 0);
  const osc = ctx.createOscillator();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain || 0.2, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g).connect(Audio2.master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function noiseBurst(dur, gain, freq, when) {
  if (!Audio2.ready) return;
  const ctx = Audio2.ctx;
  const t0 = ctx.currentTime + (when || 0);
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = freq || 900;
  const g = ctx.createGain();
  g.gain.value = gain || 0.3;
  src.connect(filt).connect(g).connect(Audio2.master);
  src.start(t0);
}

function audioPlay(name) {
  if (!Audio2.ready) return;
  switch (name) {
    case 'thunk':       // construction
      noiseBurst(0.09, 0.25, 700);
      tone(120, 0.12, 'sine', 0.25);
      break;
    case 'activate':    // route activation
      tone(523, 0.1, 'sine', 0.14);
      tone(659, 0.12, 'sine', 0.14, 0.07);
      break;
    case 'warn':
      tone(660, 0.09, 'square', 0.08);
      tone(660, 0.09, 'square', 0.08, 0.16);
      break;
    case 'sever':
      tone(520, 0.5, 'sawtooth', 0.12, 0, 130);
      break;
    case 'boom':
      noiseBurst(0.5, 0.5, 400);
      tone(70, 0.5, 'sine', 0.4, 0, 40);
      break;
    case 'chord':       // reconnection
      tone(392, 0.5, 'sine', 0.14);
      tone(494, 0.5, 'sine', 0.12, 0.03);
      tone(587, 0.7, 'sine', 0.12, 0.06);
      break;
    case 'capture':
      tone(392, 0.16, 'triangle', 0.18);
      tone(523, 0.16, 'triangle', 0.18, 0.12);
      tone(659, 0.3, 'triangle', 0.18, 0.24);
      break;
    case 'telegraph':   // rising water horn
      tone(98, 1.1, 'sawtooth', 0.14, 0, 147);
      noiseBurst(0.9, 0.12, 300, 0.1);
      break;
    case 'chant':       // consecration
      tone(196, 0.9, 'triangle', 0.1);
      tone(294, 0.9, 'triangle', 0.08, 0.05);
      break;
    case 'victory':
      [392, 494, 587, 784].forEach((f, i) => tone(f, 0.5, 'triangle', 0.2, i * 0.16));
      break;
    case 'defeat':
      [330, 262, 196, 131].forEach((f, i) => tone(f, 0.6, 'sine', 0.2, i * 0.22));
      break;
  }
}

function wireAudio() {
  Events.on('piecePlaced', ({ side }) => { if (side === 'A') { audioPlay('thunk'); audioPlay('activate'); } });
  Events.on('structureBuilt', ({ st }) => { if (st.owner === 'A') audioPlay('thunk'); });
  Events.on('networkSevered', ({ side }) => { if (side === 'A') { audioPlay('sever'); audioPlay('warn'); } });
  Events.on('networkRestored', ({ side }) => { if (side === 'A') audioPlay('chord'); });
  Events.on('structureDestroyed', () => audioPlay('boom'));
  Events.on('structureExploded', () => audioPlay('boom'));
  Events.on('islandClaimed', () => audioPlay('capture'));
  Events.on('consecrationStarted', () => audioPlay('chant'));
  Events.on('tidalSurge', () => { noiseBurst(1.2, 0.5, 250); });
  Events.on('greatTempleHit', () => audioPlay('warn'));
}

// A tileable ripple texture painted at boot: layered sine swells with a
// little seeded chop, in the sea palette. Zero assets, pure canvas.
function makeSeaTexture() {
  const S = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const rng = mulberry32(0x5EA);
  const img = ctx.createImageData(S, S);
  const base = { r: 0x10, g: 0x4b, b: 0x58 };
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const u = (x / S) * Math.PI * 2, v = (y / S) * Math.PI * 2;
      let h = Math.sin(u * 3 + Math.sin(v * 2) * 1.3) * 0.5
        + Math.sin(v * 5 + Math.sin(u * 4) * 0.8) * 0.3
        + Math.sin((u + v) * 7) * 0.2;
      h += (rng() - 0.5) * 0.25;
      const crest = clamp(h * 0.5 + 0.5, 0, 1);
      const lift = 0.82 + crest * 0.45;   // crests lighten, troughs deepen
      const i = (y * S + x) * 4;
      img.data[i] = Math.min(255, base.r * lift + crest * 14);
      img.data[i + 1] = Math.min(255, base.g * lift + crest * 20);
      img.data[i + 2] = Math.min(255, base.b * lift + crest * 22);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  return tex;
}

function initRenderer() {
  const canvas = document.getElementById('gl');
  R.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  R.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  R.scene = new THREE.Scene();
  R.scene.background = new THREE.Color(0x0d3540);
  R.scene.fog = new THREE.Fog(0x0d3540, 17, 32);

  R.camera = new THREE.PerspectiveCamera(CONFIG.Render.CAM_FOV, 1, 0.1, 100);
  R.raycaster = new THREE.Raycaster();
  R.groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

  const sun = new THREE.DirectionalLight(0xfff2dd, 0.95);
  sun.position.set(6, 14, 4);
  R.scene.add(sun);
  R.scene.add(new THREE.HemisphereLight(0xbcdce4, 0x27453a, 0.5));

  // the Aegean — rippled by a generated texture that streams with the wind
  const seaTex = makeSeaTexture();
  seaTex.wrapS = seaTex.wrapT = THREE.RepeatWrapping;
  seaTex.repeat.set(CONFIG.Grid.WIDTH * 0.7, CONFIG.Grid.HEIGHT * 0.55);
  const sea = new THREE.Mesh(
    new THREE.PlaneGeometry(CONFIG.Grid.WIDTH * 4, CONFIG.Grid.HEIGHT * 3),
    new THREE.MeshLambertMaterial({ color: 0xd8f0f2, map: seaTex })
  );
  sea.rotation.x = -Math.PI / 2;
  sea.position.y = 0;
  R.scene.add(sea);
  R.seaTex = seaTex;

  R.socketGroup = new THREE.Group();
  R.previewGroup = new THREE.Group();
  R.influenceGroup = new THREE.Group();
  R.islandGroup = new THREE.Group();
  R.scene.add(R.socketGroup, R.previewGroup, R.influenceGroup, R.islandGroup);

  onResize();
  window.addEventListener('resize', onResize);
  R.initialized = true;
}

// The map is larger than the screen on purpose: the camera keeps its
// fixed oblique angle and the player pans by dragging. Fog of war and
// room to build both come from the viewport being a window, not a wall.
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  R.renderer.setSize(w, h, false);
  R.camera.aspect = w / h;
  R.camera.updateProjectionMatrix();
  updateCamera();
}

function updateCamera() {
  if (!R.camTarget) R.camTarget = { x: 0, z: 0 };
  const fit = Math.max(1, (9 / 16) / (R.camera.aspect) * 0.92);
  const t = R.camTarget;
  const mx = (CONFIG.Grid.WIDTH - 1) / 2 + CONFIG.Render.PAN_MARGIN;
  const mz = (CONFIG.Grid.HEIGHT - 1) / 2 + CONFIG.Render.PAN_MARGIN;
  t.x = clamp(t.x, -mx, mx);
  t.z = clamp(t.z, -mz, mz + 1);
  // pinch zoom and two-finger rotation orbit the same fixed tilt
  if (R.camZoom === undefined) { R.camZoom = 1; R.camAz = 0; }
  R.camZoom = clamp(R.camZoom, 0.75, 2.6);
  const back = CONFIG.Render.CAM_BACK * fit * R.camZoom;
  const h = CONFIG.Render.CAM_HEIGHT * fit * R.camZoom;
  R.camera.position.set(
    t.x + Math.sin(R.camAz || 0) * back,
    h,
    t.z + Math.cos(R.camAz || 0) * back);
  R.camera.lookAt(t.x, 0, t.z);
  // atmospheric depth cue scales with zoom so zooming out never fogs
  // ground the player could see up close
  if (R.scene && R.scene.fog) {
    const d = Math.hypot(back, h);
    R.scene.fog.near = d * 1.12;
    R.scene.fog.far = d * 2.1;
  }
}

function panCameraTo(wx, wz) {
  R.camTarget = { x: wx, z: wz };
  updateCamera();
}

// ---------------- static map ----------------
function buildMapMeshes(state) {
  R.islandGroup.clear();
  R.whitecaps = [];
  R.trees = [];
  R.smoke = [];

  const cellGeo = new THREE.BoxGeometry(1.0, CONFIG.Render.ISLAND_HEIGHT, 1.0);
  const beachGeo = new THREE.BoxGeometry(1.12, CONFIG.Render.ISLAND_HEIGHT * 0.45, 1.12);
  for (const isl of state.map.islands) {
    const grp = new THREE.Group();
    const stoneMat = new THREE.MeshLambertMaterial({ color: Palette.limestone });
    // the island's base tints with its allegiance (updated per frame)
    const beachMat = new THREE.MeshLambertMaterial({ color: Palette.limestoneShade });
    isl.beachMat = beachMat;
    const rngIsl = mulberry32(hashString(state.seed + ':isl' + isl.id));
    for (const [cx, cz] of isl.cells) {
      const beach = new THREE.Mesh(beachGeo, beachMat);
      beach.position.set(worldX(cx), CONFIG.Render.ISLAND_HEIGHT * 0.2, worldZ(cz));
      grp.add(beach);
      const rock = new THREE.Mesh(cellGeo, stoneMat);
      rock.position.set(worldX(cx), CONFIG.Render.ISLAND_HEIGHT / 2 + 0.02, worldZ(cz));
      rock.scale.set(0.94 + rngIsl() * 0.1, 0.9 + rngIsl() * 0.25, 0.94 + rngIsl() * 0.1);
      grp.add(rock);
      // trees lean with the wind (a mandated wind tell, §21A.5)
      if (rngIsl() < 0.45 && !isl.plots.some(p => p.x === cx && p.z === cz)) {
        const tree = new THREE.Mesh(
          new THREE.ConeGeometry(0.16 + rngIsl() * 0.08, 0.34 + rngIsl() * 0.2, 6),
          new THREE.MeshLambertMaterial({ color: rngIsl() < 0.5 ? Palette.canopy : Palette.canopyDark })
        );
        tree.position.set(
          worldX(cx) + (rngIsl() - 0.5) * 0.55,
          CONFIG.Render.ISLAND_HEIGHT + 0.16,
          worldZ(cz) + (rngIsl() - 0.5) * 0.55);
        grp.add(tree);
        R.trees.push({ mesh: tree, gx: cx, gz: cz });
      }
    }
    // plots: bronze discs
    for (const p of isl.plots) {
      const disc = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.34, 0.05, 12),
        new THREE.MeshLambertMaterial({ color: Palette.bronze })
      );
      disc.position.set(worldX(p.x), CONFIG.Render.ISLAND_HEIGHT + 0.05, worldZ(p.z));
      grp.add(disc);
    }
    R.islandGroup.add(grp);
  }

  // the two Great Temples
  for (const side of ['A', 'P']) {
    const gt = state.greatTemple[side];
    const grp = new THREE.Group();
    const isA = side === 'A';
    const stone = new THREE.MeshLambertMaterial({ color: isA ? Palette.ivory : Palette.poseidonStone });
    const trim = new THREE.MeshLambertMaterial({ color: isA ? Palette.gold : Palette.poseidonGlow });
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.6, 0.16, 10), stone);
    base.position.y = 0.08;
    grp.add(base);
    for (let i = 0; i < 6; i++) {
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 6), stone);
      const a = (i / 6) * Math.PI * 2;
      col.position.set(Math.cos(a) * 0.36, 0.4, Math.sin(a) * 0.36);
      grp.add(col);
    }
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.26, 10), trim);
    roof.position.y = 0.76;
    grp.add(roof);
    grp.position.set(worldX(gt.cell[0]), CONFIG.Render.ISLAND_HEIGHT + 0.04, worldZ(gt.cell[1]));
    R.islandGroup.add(grp);
    gt.mesh = grp;
    // temple smoke plume (wind tell)
    const puffMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    for (let i = 0; i < 3; i++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.07 + i * 0.03, 6, 5), puffMat.clone());
      puff.position.copy(grp.position);
      R.scene.add(puff);
      R.smoke.push({ mesh: puff, base: grp.position.clone(), phase: i / 3, gx: gt.cell[0], gz: gt.cell[1] });
    }
  }

  // whitecaps: the primary wind readout over water
  const capMat = new THREE.MeshBasicMaterial({ color: 0xdff3f2, transparent: true, opacity: 0.0 });
  const capGeo = new THREE.PlaneGeometry(0.34, 0.07);
  const rngCaps = mulberry32(hashString(state.seed + ':caps'));
  for (let i = 0; i < CONFIG.Render.WHITECAP_COUNT; i++) {
    let gx, gz, tries = 20;
    do { gx = rngCaps() * (CONFIG.Grid.WIDTH - 1); gz = rngCaps() * (CONFIG.Grid.HEIGHT - 1); }
    while (state.map.land.has(cellKey(Math.round(gx), Math.round(gz))) && tries-- > 0);
    const cap = new THREE.Mesh(capGeo, capMat.clone());
    cap.rotation.x = -Math.PI / 2;
    cap.position.set(worldX(gx), 0.02, worldZ(gz));
    R.scene.add(cap);
    R.whitecaps.push({ mesh: cap, gx, gz, phase: rngCaps() });
  }
}

// ---------------- segments ----------------
function segMeshKey(seg) { return seg.owner + ':' + seg.key; }

function makeSegMesh(seg) {
  const isAir = seg.owner === 'A';
  const y = isAir ? CONFIG.Render.AIR_ALTITUDE : CONFIG.Render.SEA_ALTITUDE;
  const ax = worldX(seg.a[0]), az = worldZ(seg.a[1]);
  const bx = worldX(seg.b[0]), bz = worldZ(seg.b[1]);
  const grp = new THREE.Group();
  const len = Math.hypot(bx - ax, bz - az);
  const mat = new THREE.MeshLambertMaterial({
    color: isAir ? Palette.ivory : 0x062630,
    emissive: isAir ? Palette.aeolusGlow : 0x0a3540,
    emissiveIntensity: isAir ? 0.45 : 0.55,
    transparent: true, opacity: isAir ? 0.92 : 0.9
  });
  const body = new THREE.Mesh(
    isAir ? new THREE.BoxGeometry(len + 0.14, 0.055, 0.14)
          : new THREE.BoxGeometry(len + 0.2, 0.03, 0.42),
    mat);
  grp.add(body);
  if (!isAir) {
    // bright current stripe so sea lanes read against the water
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(len + 0.18, 0.035, 0.09),
      new THREE.MeshBasicMaterial({ color: Palette.poseidonGlow, transparent: true, opacity: 0.85 }));
    stripe.position.y = 0.012;
    grp.add(stripe);
    grp.userData.stripe = stripe;
  }
  if (isAir) {
    // faint support pylons reference the corridor down toward the water
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.015, y, 0.015),
      new THREE.MeshBasicMaterial({ color: Palette.ivory, transparent: true, opacity: 0.16 }));
    post.position.y = -y / 2;
    grp.add(post);
  }
  grp.position.set((ax + bx) / 2, y, (az + bz) / 2);
  grp.rotation.y = -Math.atan2(bz - az, bx - ax);
  grp.userData.mat = mat;
  grp.userData.isAir = isAir;
  return grp;
}

function syncSegments(state) {
  const seen = new Set();
  for (const s of state.segments.values()) {
    const k = segMeshKey(s);
    seen.add(k);
    let mesh = R.segMeshes.get(k);
    if (!mesh) {
      mesh = makeSegMesh(s);
      R.segMeshes.set(k, mesh);
      R.scene.add(mesh);
    }
    // fog: enemy segments need vision, or memory at reduced brightness (§14B.2)
    const segVis = typeof segmentVisibility === 'function' ? segmentVisibility(state, s) : 'full';
    mesh.visible = segVis !== 'hidden';
    const mat = mesh.userData.mat;
    const isAir = mesh.userData.isAir;
    if (segVis === 'dim') {
      mat.color.setHex(0x3a4d52);
      mat.emissiveIntensity = 0.05;
      mat.opacity = 0.3;
      if (mesh.userData.stripe) mesh.userData.stripe.material.opacity = 0.1;
      continue;
    }
    const stripe = mesh.userData.stripe;
    if (s.supportState === 'SUPPORTED') {
      mat.color.setHex(isAir ? Palette.ivory : 0x062630);
      mat.emissiveIntensity = isAir ? 0.45 : 0.55;
      mat.opacity = isAir ? 0.92 : 0.9;
      if (stripe) stripe.material.opacity = 0.85;
    } else if (s.supportState === 'FRAYED') {
      mat.color.setHex(Palette.frayed);
      mat.emissiveIntensity = 0.12;
      mat.opacity = 0.55 + 0.25 * Math.sin(state.time * 9);
      if (stripe) stripe.material.opacity = 0.15;
    } else {
      mat.color.setHex(Palette.collapsing);
      mat.emissiveIntensity = 0.5 + 0.4 * Math.sin(state.time * 14);
      mat.opacity = 0.5 + 0.3 * Math.sin(state.time * 14);
      if (stripe) stripe.material.opacity = 0.1;
    }
  }
  for (const [k, mesh] of R.segMeshes) {
    if (!seen.has(k)) {
      R.scene.remove(mesh);
      R.segMeshes.delete(k);
    }
  }
}

// ---------------- sockets, preview, influence ----------------
function showSockets(state, sockets) {
  R.socketGroup.clear();
  for (const s of sockets) {
    const grp = new THREE.Group();
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.3, 0.46, 24),
      new THREE.MeshBasicMaterial({ color: Palette.socket, transparent: true, opacity: 0.95, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    // a beacon of light so sockets read from anywhere on the map
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.09, 2.6, 8, 1, true),
      new THREE.MeshBasicMaterial({ color: Palette.socket, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
    beam.position.y = 1.3;
    grp.add(ring, beam);
    const y = islandAtCells(state, s.cell) ? CONFIG.Render.ISLAND_HEIGHT + 0.06 : CONFIG.Render.AIR_ALTITUDE;
    grp.position.set(worldX(s.cell[0]), y, worldZ(s.cell[1]));
    grp.userData.socket = s;
    grp.userData.ring = ring;
    R.socketGroup.add(grp);
  }
}
function islandAtCells(state, cell) { return islandAt(state, cell[0], cell[1]); }
function clearSockets() { R.socketGroup.clear(); }

function showPreview(state, segs, ok) {
  R.previewGroup.clear();
  const y = CONFIG.Render.AIR_ALTITUDE;
  for (const [a, b] of segs) {
    const ax = worldX(a[0]), az = worldZ(a[1]), bx = worldX(b[0]), bz = worldZ(b[1]);
    const len = Math.hypot(bx - ax, bz - az);
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(len + 0.14, 0.09, 0.24),
      new THREE.MeshBasicMaterial({
        color: ok ? Palette.socket : Palette.danger,
        transparent: true, opacity: 0.7
      }));
    mesh.position.set((ax + bx) / 2, y, (az + bz) / 2);
    mesh.rotation.y = -Math.atan2(bz - az, bx - ax);
    R.previewGroup.add(mesh);
  }
  // arrowheads on every open end of the ghost, so its direction reads
  const cellCount = new Map();
  for (const [a, b] of segs) {
    for (const c of [a, b]) {
      const k = cellKey(c[0], c[1]);
      cellCount.set(k, (cellCount.get(k) || 0) + 1);
    }
  }
  for (const [a, b] of segs) {
    for (const [tip, from] of [[b, a], [a, b]]) {
      if (cellCount.get(cellKey(tip[0], tip[1])) !== 1) continue;
      const gem = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.15),
        new THREE.MeshBasicMaterial({ color: ok ? Palette.socket : Palette.danger, transparent: true, opacity: 0.95 }));
      gem.position.set(worldX(tip[0]), y, worldZ(tip[1]));
      gem.userData.spin = true;
      R.previewGroup.add(gem);
    }
  }
}
function clearPreview() { R.previewGroup.clear(); }

// influence edge shading: subtle tint so buildable ground reads
function refreshInfluenceView(state) {
  R.influenceGroup.clear();
  const geo = new THREE.PlaneGeometry(0.98, 0.98);
  const matA = new THREE.MeshBasicMaterial({ color: Palette.gold, transparent: true, opacity: 0.05 });
  const matC = new THREE.MeshBasicMaterial({ color: 0xd97fd9, transparent: true, opacity: 0.06 });
  for (const k of state.influence.A) {
    const [x, z] = keyCell(k);
    if (state.map.land.has(k)) continue;
    const m = new THREE.Mesh(geo, state.influence.contested.has(k) ? matC : matA);
    m.rotation.x = -Math.PI / 2;
    m.position.set(worldX(x), 0.012, worldZ(z));
    R.influenceGroup.add(m);
  }
}

// ---------------- per-frame ----------------
function renderTick(state, dt) {
  // the sea itself streams with the wind under the camera
  if (R.seaTex) {
    const [cgx, cgz] = gridFromWorld(R.camTarget ? R.camTarget.x : 0, R.camTarget ? R.camTarget.z : 0);
    const w = state.wind.at(clamp(cgx, 0, CONFIG.Grid.WIDTH - 1), clamp(cgz, 0, CONFIG.Grid.HEIGHT - 1));
    R.seaTex.offset.x -= w.x * dt * 0.028;
    R.seaTex.offset.y += w.z * dt * 0.028;
  }
  // whitecaps ride the wind for a few seconds, fade, and respawn at a
  // fresh spot — so the field stays evenly alive instead of pooling at
  // the rim where the sheared wind runs parallel to the edge
  if (!R.capRng) R.capRng = mulberry32(0xCAB5);
  for (const c of R.whitecaps) {
    const w = state.wind.at(c.gx, c.gz);
    c.gx += w.x * dt * 0.55;
    c.gz += w.z * dt * 0.55;
    c.life = (c.life === undefined ? 3 + c.phase * 5 : c.life) - dt;
    if (c.life <= 0 ||
        c.gx < 0 || c.gx > CONFIG.Grid.WIDTH - 1 || c.gz < 0 || c.gz > CONFIG.Grid.HEIGHT - 1) {
      let tries = 12;
      do {
        c.gx = R.capRng() * (CONFIG.Grid.WIDTH - 1);
        c.gz = R.capRng() * (CONFIG.Grid.HEIGHT - 1);
      } while (state.map.land.has(cellKey(Math.round(c.gx), Math.round(c.gz))) && tries-- > 0);
      c.life = 4 + R.capRng() * 6;
      c.phase = R.capRng();
    }
    c.phase += dt * 1.4;
    c.mesh.position.x = worldX(c.gx);
    c.mesh.position.z = worldZ(c.gz);
    c.mesh.rotation.z = -Math.atan2(w.z, w.x);
    const onLand = state.map.land.has(cellKey(Math.round(c.gx), Math.round(c.gz)));
    const fade = Math.min(1, Math.min(c.life, 1.2));
    c.mesh.material.opacity = onLand ? 0 : (0.16 + 0.16 * Math.sin(c.phase * Math.PI * 2)) * fade;
  }
  // trees lean into the wind
  for (const t of R.trees) {
    const w = state.wind.at(t.gx, t.gz);
    t.mesh.rotation.z = -w.x * 0.22;
    t.mesh.rotation.x = w.z * 0.22;
  }
  // smoke plumes stream downwind
  for (const s of R.smoke) {
    s.phase = (s.phase + dt * 0.35) % 1;
    const w = state.wind.at(s.gx, s.gz);
    const d = s.phase * 1.1;
    s.mesh.position.set(s.base.x + w.x * d, s.base.y + 0.85 + s.phase * 0.5, s.base.z + w.z * d);
    s.mesh.material.opacity = 0.32 * (1 - s.phase);
    s.mesh.scale.setScalar(0.7 + s.phase * 1.6);
  }
  // pulse the placement affordances so they are unmissable
  const pulse = 1 + 0.13 * Math.sin(state.time * 5);
  for (const g of R.socketGroup.children) {
    if (g.userData.ring) g.userData.ring.scale.setScalar(pulse);
  }
  for (const m of R.previewGroup.children) {
    if (m.userData && m.userData.spin) m.rotation.y += dt * 2.5;
  }
  syncSegments(state);
  R.renderer.render(R.scene, R.camera);
}

// pointer -> ground-plane point (world coords), or null
function pickGround(clientX, clientY) {
  const rect = R.renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1);
  R.raycaster.setFromCamera(ndc, R.camera);
  const pt = new THREE.Vector3();
  if (!R.raycaster.ray.intersectPlane(R.groundPlane, pt)) return null;
  return pt;
}

// tap -> grid cell (or null)
function pickCell(clientX, clientY) {
  const pt = pickGround(clientX, clientY);
  if (!pt) return null;
  const [gx, gz] = gridFromWorld(pt.x, pt.z);
  if (!inBounds(gx, gz)) return null;
  return [gx, gz];
}
